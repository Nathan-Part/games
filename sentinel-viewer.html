<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel & Cyborg — Animations partagées</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(20, 24, 33, 0.85);
    --border: rgba(120, 150, 220, 0.18);
    --accent: #5b8cff;
    --accent-2: #b56bff;
    --text: #e8ecf4;
    --muted: #8a93a6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Panneau gauche : animations */
  #panel {
    position: fixed; top: 16px; left: 16px; width: 250px;
    max-height: calc(100vh - 32px); display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 16px; padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index: 10;
  }
  h1 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  h1 .dot { width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px var(--accent); }
  .sub { font-size: 11.5px; color: var(--muted); margin: 4px 0 14px; line-height: 1.5; }
  .section-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 0 0 8px; font-weight: 700; }

  #list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 4px; }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .anim-btn { text-align: left; background: rgba(255,255,255,0.03); color: var(--text);
    border: 1px solid transparent; border-radius: 10px; padding: 9px 12px; font-size: 13px;
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 9px; }
  .anim-btn:hover { background: rgba(91,140,255,0.12); border-color: var(--border); }
  .anim-btn.active { background: linear-gradient(135deg, rgba(91,140,255,0.25), rgba(181,107,255,0.2));
    border-color: var(--accent); font-weight: 600; }
  .anim-btn .icon { font-size: 14px; opacity: 0.8; width: 18px; text-align: center; }
  .anim-btn .badge { margin-left: auto; font-size: 8.5px; padding: 2px 6px; border-radius: 6px;
    background: rgba(181,107,255,0.25); color: #d9b8ff; font-weight: 700; letter-spacing: .3px; }

  /* Panneau droit : choix du corps */
  #bodies {
    position: fixed; top: 16px; right: 16px; width: 170px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 16px; padding: 14px; z-index: 10;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .body-btn { width: 100%; text-align: center; background: rgba(255,255,255,0.03);
    color: var(--text); border: 1px solid transparent; border-radius: 12px;
    padding: 14px 8px; font-size: 14px; cursor: pointer; transition: all 0.15s;
    font-weight: 700; margin-top: 8px; }
  .body-btn:first-of-type { margin-top: 10px; }
  .body-btn:hover { background: rgba(91,140,255,0.12); border-color: var(--border); }
  .body-btn.active { background: linear-gradient(135deg, rgba(91,140,255,0.28), rgba(181,107,255,0.22));
    border-color: var(--accent); }
  .body-btn .ico { font-size: 22px; display: block; margin-bottom: 4px; }
  .body-btn small { display: block; font-weight: 400; font-size: 10px; color: var(--muted); margin-top: 3px; }

  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 16px; z-index: 10; font-size: 12.5px; }
  #controls label { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #controls input[type=range] { width: 110px; accent-color: var(--accent); }
  .now { color: var(--text); font-weight: 600; min-width: 160px; }

  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: var(--bg);
    z-index: 50; transition: opacity 0.4s; text-align: center; padding: 24px; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 44px; height: 44px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlay .msg { color: var(--muted); font-size: 13.5px; max-width: 460px; line-height: 1.6; }
  .err-title { color: #ff6b6b; font-weight: 700; font-size: 16px; }
  code { background: rgba(255,255,255,0.08); padding: 2px 7px; border-radius: 6px; font-size: 12.5px; color: #ffd479; }
  .hint { position: fixed; bottom: 16px; right: 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
    font-size: 11px; color: var(--muted); z-index: 10; max-width: 200px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <h1><span class="dot"></span> Animations</h1>
  <div class="sub">Les 14 clips viennent des fichiers Sentinel. Choisis le corps à droite, clique une animation.</div>
  <div class="section-label">Liste</div>
  <div id="list"></div>
</div>

<div id="bodies">
  <div class="section-label" style="margin:0">Corps</div>
  <button class="body-btn" data-body="sentinel"><span class="ico">🛡️</span>Sentinel<small>14 anim. propres</small></button>
  <button class="body-btn" data-body="cyborg"><span class="ico">🤖</span>Cyborg<small>3 anim. propres</small></button>
</div>

<div id="controls">
  <span class="now" id="now">—</span>
  <label>Vitesse <input type="range" id="speed" min="0" max="2" step="0.05" value="1" /></label>
</div>

<div class="hint">🖱️ Glisse pour tourner · molette pour zoomer.<br>Badge <b style="color:#d9b8ff">EMPRUNTÉE</b> = anim. absente des fichiers de ce corps.</div>

<div id="overlay">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="overlay-msg">Chargement…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Modèles ----
const MODELS = {
  sentinel: { label:'Sentinel', dir:'Meshy_AI_T_Pose_Sentinel_biped/',
    prefix:'Meshy_AI_T_Pose_Sentinel_biped_Animation_',
    own:['Walking','Running','RunFast','Run_03','Walking_Woman','Alert','Agree_Gesture',
         'Attack','Triple_Combo_Attack','Boxing_Practice','Skill_01','Skill_03','Boom_Dance','All_Night_Dance'] },
  cyborg:   { label:'Cyborg', dir:'Meshy_AI_Blue_Neon_Cyborg_biped/',
    prefix:'Meshy_AI_Blue_Neon_Cyborg_biped_Animation_',
    own:['Walking','Running','Triple_Combo_Attack'] },
};
const SUFFIX = '_withSkin.glb';
const ANIM_SOURCE = MODELS.sentinel;   // toutes les anims viennent de là
const ROOT_BONE = 'Hips';

// Liste complète des animations (identique pour les deux corps)
const ANIMS = [
  ['Walking','Marche','🚶'], ['Running','Course','🏃'], ['RunFast','Course rapide','💨'],
  ['Run_03','Course (var.)','🏃'], ['Walking_Woman','Marche (var.)','🚶'], ['Alert','En alerte','⚠️'],
  ['Agree_Gesture','Approuver','👍'], ['Attack','Attaque','⚔️'], ['Triple_Combo_Attack','Combo triple','🥊'],
  ['Boxing_Practice','Boxe','🥊'], ['Skill_01','Compétence 1','✨'], ['Skill_03','Compétence 3','🔥'],
  ['Boom_Dance','Danse Boom','🕺'], ['All_Night_Dance','Danse all-night','💃'],
];

// ---------- Scène ----------
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
scene.fog = new THREE.Fog(0x0b0d12, 10, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.5, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0x9bb6ff, 0x1a1d26, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 8, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.far = 30; scene.add(key);
const rim = new THREE.DirectionalLight(0xb56bff, 1.2); rim.position.set(-5, 4, -5); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0x12151d, roughness: 0.9, metalness: 0.1 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(16, 32, 0x2a3550, 0x1a1f2e); grid.position.y = 0.001; scene.add(grid);

// ---------- État ----------
const loader = new GLTFLoader();
const rawClips = {};              // animKey -> clip original (Sentinel)
const retargetCache = {};         // "body:anim" -> clip retargeté
let mixer = null, model = null, currentAction = null;
let currentBody = 'sentinel', currentAnim = 'Walking';
let sourceModel = null, sourceBoneByName = {};
let sourceRest = null, sourceRestWorld = null;   // pose de repos Sentinel (local + monde)
let targetRest = null, targetRestWorld = null, targetBoneOrder = null;

const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlay-msg');
const spinner = document.getElementById('spinner');
const list = document.getElementById('list');
const nowEl = document.getElementById('now');
const speedEl = document.getElementById('speed');

function showError(e) {
  spinner.style.display = 'none'; overlay.classList.remove('hidden');
  overlayMsg.innerHTML = `<div class="err-title">⚠️ Chargement impossible</div>
    <p style="margin-top:12px">Ouvre la page via un serveur local (pas en <code>file://</code>) :</p>
    <p style="margin-top:6px"><code>http://localhost:8123/sentinel-viewer.html</code></p>
    <p style="margin-top:8px; font-size:12px; opacity:.8">${e?.message || e}</p>`;
}

// Pose de repos LOCALE (rotation + position de chaque os), avant toute animation.
function captureRest(root) {
  const map = {};
  root.traverse(o => {
    if (o.isBone) map[o.name] = { q: o.quaternion.clone(), p: o.position.clone() };
  });
  return map;
}
// Pose de repos en ESPACE-MONDE (orientation absolue de chaque os).
function captureRestWorld(root) {
  root.updateMatrixWorld(true);
  const map = {}; const q = new THREE.Quaternion();
  root.traverse(o => { if (o.isBone) { o.getWorldQuaternion(q); map[o.name] = q.clone(); } });
  return map;
}
// Liste des os en ordre parent-d'abord (DFS), avec le nom du parent-os.
function boneOrder(root) {
  const list = [];
  root.traverse(o => {
    if (o.isBone) list.push({ name: o.name, parent: (o.parent && o.parent.isBone) ? o.parent.name : null });
  });
  return list;
}

// === RETARGETING EN ESPACE-MONDE ===
// Les deux squelettes sont en T-pose debout : leurs os ont donc la même orientation
// dans le MONDE au repos, même si leurs rotations LOCALES diffèrent (axes locaux
// différents par os). On échantillonne l'anim sur le Sentinel, on lit l'orientation
// monde de chaque os, on transfère son écart par rapport au repos monde, puis on
// reconvertit en local sur le Cyborg. C'est insensible aux différences d'axes locaux,
// donc plus de torsion ni de basculement du corps.
function retargetClipWorld(raw) {
  const dur = raw.duration;
  const n = Math.max(2, Math.round(dur * 30) + 1);          // ~30 images/s
  const srcMixer = new THREE.AnimationMixer(sourceModel);
  srcMixer.clipAction(raw).play();

  const samples = {};                                       // os -> [Quaternion local par image]
  for (const b of targetBoneOrder) samples[b.name] = [];
  const times = [];
  const qWsrc = new THREE.Quaternion(), tmp = new THREE.Quaternion();
  const tgtWorld = {};

  for (let f = 0; f < n; f++) {
    const t = (f / (n - 1)) * dur;
    times.push(t);
    srcMixer.setTime(t);
    sourceModel.updateMatrixWorld(true);
    for (const b of targetBoneOrder) {
      const sBone = sourceBoneByName[b.name];
      const sRW = sourceRestWorld[b.name], tRW = targetRestWorld[b.name];
      if (!sBone || !sRW || !tRW) { samples[b.name].push(null); continue; }
      sBone.getWorldQuaternion(qWsrc);
      // orientation monde voulue = (écart monde du Sentinel) appliqué au repos monde du Cyborg
      tmp.copy(qWsrc).multiply(sRW.clone().invert()).multiply(tRW);   // qWsrc · sRW⁻¹ · tRW
      tgtWorld[b.name] = tmp.clone();
      const localQ = b.parent && tgtWorld[b.parent]
        ? tgtWorld[b.parent].clone().invert().multiply(tmp)           // local = parentMonde⁻¹ · monde
        : tmp.clone();                                                // racine : parent = identité
      samples[b.name].push(localQ);
    }
  }
  srcMixer.stopAllAction();

  const tracks = [];
  const timesArr = Float32Array.from(times);
  for (const name in samples) {
    const arr = samples[name];
    if (!arr.length || arr.some(q => !q)) continue;
    const vals = new Float32Array(arr.length * 4);
    for (let i = 0; i < arr.length; i++) { const q = arr[i]; vals[i*4]=q.x; vals[i*4+1]=q.y; vals[i*4+2]=q.z; vals[i*4+3]=q.w; }
    tracks.push(new THREE.QuaternionKeyframeTrack(name + '.quaternion', timesArr, vals));
  }

  // Bassin : on garde seulement le rebond vertical, recentré en X/Z (anim sur place).
  const hp = raw.tracks.find(tt => tt.name === ROOT_BONE + '.position');
  const sP = sourceRest[ROOT_BONE]?.p, tP = targetRest[ROOT_BONE]?.p;
  if (hp && sP && tP) {
    const ratio = sP.y ? tP.y / sP.y : 1;
    const vals = Float32Array.from(hp.values);
    for (let i = 0; i < vals.length; i += 3) {
      vals[i] = tP.x; vals[i+1] = tP.y + (vals[i+1] - sP.y) * ratio; vals[i+2] = tP.z;
    }
    tracks.push(new THREE.VectorKeyframeTrack(ROOT_BONE + '.position', Array.from(hp.times), vals));
  }
  return new THREE.AnimationClip(raw.name, raw.duration, tracks);
}

function clipForCurrentBody(animKey) {
  const cacheKey = currentBody + ':' + animKey;
  if (retargetCache[cacheKey]) return retargetCache[cacheKey];
  const raw = rawClips[animKey];
  if (!raw || !sourceModel || !targetBoneOrder) return raw || null;
  const c = retargetClipWorld(raw);
  retargetCache[cacheKey] = c;
  return c;
}

async function loadClips() {
  await Promise.all(ANIMS.map(async ([k]) => {
    try {
      const g = await loader.loadAsync(ANIM_SOURCE.dir + ANIM_SOURCE.prefix + k + SUFFIX);
      if (g.animations[0]) { g.animations[0].name = k; rawClips[k] = g.animations[0]; }
      // référence : squelette Sentinel au repos (gardé pour échantillonner les anims)
      if (sourceModel === null) {
        sourceModel = g.scene;
        sourceRest = captureRest(g.scene);
        sourceRestWorld = captureRestWorld(g.scene);
        g.scene.traverse(o => { if (o.isBone) sourceBoneByName[o.name] = o; });
      }
    } catch (e) { console.warn('clip manquant', k, e); }
  }));
}

async function loadBody(bodyKey) {
  const cfg = MODELS[bodyKey];
  const gltf = await loader.loadAsync(cfg.dir + cfg.prefix + 'Walking' + SUFFIX);
  const newModel = gltf.scene;
  newModel.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  // pose de repos de CE corps (local + monde + hiérarchie), avant toute animation
  targetRest = captureRest(newModel);
  targetRestWorld = captureRestWorld(newModel);
  targetBoneOrder = boneOrder(newModel);

  const box = new THREE.Box3().setFromObject(newModel);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = 1.8 / size.y;
  newModel.scale.setScalar(s);
  newModel.position.sub(center.multiplyScalar(s));
  newModel.position.y += (size.y * s) / 2;

  if (model) scene.remove(model);
  model = newModel; scene.add(model);
  mixer = new THREE.AnimationMixer(model);
  currentAction = null;
  currentBody = bodyKey;
  play(currentAnim, true);
  refreshUI();
}

function play(animKey, force=false) {
  const clip = clipForCurrentBody(animKey);
  if (!clip || !mixer) return;
  const next = mixer.clipAction(clip);
  next.reset();
  next.setEffectiveTimeScale(parseFloat(speedEl.value));
  next.play();
  if (currentAction && currentAction !== next && !force) currentAction.crossFadeTo(next, 0.3, false);
  currentAction = next;
  currentAnim = animKey;

  const meta = ANIMS.find(a => a[0] === animKey);
  const owns = MODELS[currentBody].own.includes(animKey);
  nowEl.textContent = `▶ ${MODELS[currentBody].label} — ${meta?.[1] || animKey}` + (owns ? '' : '  (empruntée)');
  document.querySelectorAll('.anim-btn').forEach(b => b.classList.toggle('active', b.dataset.key === animKey));
}

function refreshUI() {
  // surbrillance corps
  document.querySelectorAll('.body-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.body === currentBody));
  // liste anims (toujours les 14, identiques pour chaque corps)
  list.innerHTML = '';
  for (const [k, label, icon] of ANIMS) {
    if (!rawClips[k]) continue;
    const owns = MODELS[currentBody].own.includes(k);
    const btn = document.createElement('button');
    btn.className = 'anim-btn' + (k === currentAnim ? ' active' : '');
    btn.dataset.key = k;
    btn.innerHTML = `<span class="icon">${icon}</span> ${label}` + (owns ? '' : '<span class="badge">EMPRUNTÉE</span>');
    btn.onclick = () => play(k);
    list.appendChild(btn);
  }
}

// boutons corps (droite)
document.querySelectorAll('.body-btn').forEach(b => {
  b.onclick = () => {
    const k = b.dataset.body;
    if (k === currentBody) return;
    showLoading('Changement de corps…');
    loadBody(k).then(hideLoading).catch(showError);
  };
});

function showLoading(msg){ overlayMsg.textContent=msg; spinner.style.display=''; overlay.classList.remove('hidden'); }
function hideLoading(){ overlay.classList.add('hidden'); }

speedEl.oninput = () => { if (currentAction) currentAction.setEffectiveTimeScale(parseFloat(speedEl.value)); };

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(async function init(){
  try {
    showLoading('Chargement des 14 animations…');
    await loadClips();
    showLoading('Chargement du corps…');
    await loadBody('sentinel');
    hideLoading();
  } catch (e) { console.error(e); showError(e); }
})();
</script>
</body>
</html>
