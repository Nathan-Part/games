<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPÉRATION SURVIE</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  /* ===================== OPERATOR — design system (refonte UI v2) ===================== */
  :root{
    --bg-900:#0b0c0e; --bg-800:#101216; --bg-700:#161a20; --bg-600:#1d222a; --bg-500:#262c36;
    --line:#2f3742; --line-2:#414b59;
    --text:#eef1f6; --text-2:#aeb7c4; --text-3:#737d8c;
    --accent:#ff6a1a; --accent-2:#ff8a3d; --accent-ink:#1a0d04; --accent-glow:rgba(255,106,26,.30);
    --ok:#36d07f; --danger:#ff4d4d; --gold:#ffd15c;
    --r-commun:#9aa3b2; --r-rare:#4f9dff; --r-epique:#b066ff; --r-legendaire:#ffb02e;
    --font-display:'Barlow Condensed','Oswald',system-ui,sans-serif;
    --font-ui:'Barlow',system-ui,'Segoe UI',sans-serif;
    --shadow-1:0 2px 10px rgba(0,0,0,.45); --shadow-2:0 18px 50px rgba(0,0,0,.6);
    --t-xs:11px; --t-sm:13px; --t-md:15px; --t-lg:18px; --t-xl:24px; --t-2xl:34px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg-900);color:var(--text);
    font-family:var(--font-ui);font-size:16px;-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  .eyebrow{font-family:var(--font-display);font-weight:600;font-size:var(--t-xs);letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);opacity:.92}
  .ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em}   /* C-1 : aucun fill/stroke global */
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* --- cadre tactique chanfreiné bordé (M-1 : ::before bordure / ::after fond, pas de clip sur l'hôte) --- */
  .tac{position:relative;isolation:isolate;background:transparent;--ch:12px;--bd:1px}
  .tac::before{content:"";position:absolute;inset:0;z-index:0;background:var(--line-2);
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .tac::after{content:"";position:absolute;inset:var(--bd);z-index:0;background:var(--bg-700);
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .tac>*{position:relative;z-index:1}
  .br{position:absolute;width:13px;height:13px;border:2px solid var(--accent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
  .tac.lit>.br,.tac:hover>.br{opacity:.85}
  .br.tl{top:6px;left:6px;border-right:0;border-bottom:0}
  .br.tr{top:6px;right:6px;border-left:0;border-bottom:0}
  .br.bl{bottom:6px;left:6px;border-right:0;border-top:0}
  .br.br2{bottom:6px;right:6px;border-left:0;border-top:0}
  /* --- boutons --- */
  .btn{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:var(--t-md);
    cursor:pointer;border:0;color:var(--text);background:var(--bg-600);padding:12px 22px;display:inline-flex;align-items:center;
    gap:8px;justify-content:center;transition:transform .15s ease-out,background .15s,box-shadow .15s;--ch:9px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .btn .ico{width:18px;height:18px}
  .btn:hover{transform:translateY(-2px);background:var(--bg-500)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}   /* C-2 : anneau interne (clip-path coupe outline) */
  .btn:disabled{opacity:.4;cursor:default;transform:none}
  .btn--primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 8px 26px var(--accent-glow)}
  .btn--primary:hover{background:linear-gradient(135deg,var(--accent-2),var(--accent))}
  .btn--primary:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-ink),0 8px 26px var(--accent-glow)}
  .btn--ghost{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line-2)}
  .btn--ghost:hover{box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
  .btn--ghost:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
  .btn--ok{background:rgba(54,208,127,.14);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
  .btn--upgrade{background:linear-gradient(135deg,#ffb02e,#ff7d2e);color:#231405}
  .btn--upgrade:focus-visible{box-shadow:inset 0 0 0 2px #231405}
  /* --- stat bars segmentées --- */
  .statbar{display:grid;grid-template-columns:84px 1fr 52px;align-items:center;gap:10px;margin:5px 0;font-size:var(--t-sm)}
  .statbar>.lbl{color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;font-size:var(--t-xs)}
  .statbar>.trk{height:8px;background:var(--bg-500);position:relative;overflow:hidden}
  .statbar>.trk>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .statbar>.val{font-family:var(--font-display);font-weight:700;text-align:right;color:var(--text);font-feature-settings:'tnum' 1}
  /* --- badge rareté (M-8 : le hex litéral reste dans l'attribut style via --rc, requis par les tests) --- */
  .rb{font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 8px;display:inline-block;vertical-align:middle;color:var(--rc,#9aa3b2);
    background:var(--rc,#9aa3b2);background:color-mix(in srgb,var(--rc,#9aa3b2) 16%,transparent);
    box-shadow:inset 0 0 0 1px var(--rc,#9aa3b2);--ch:5px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  /* --- carte d'item (boutique) --- */
  .icard{position:relative;background:var(--bg-600);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;
    transition:transform .15s ease-out,background .15s;--ch:11px;color:var(--text);text-align:left;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch));
    box-shadow:inset 0 2px 0 0 var(--rc,var(--line)),inset 0 0 0 1px var(--line)}
  .icard:hover{transform:translateY(-3px);background:var(--bg-500)}
  .icard.on{box-shadow:inset 0 2px 0 0 var(--rc,var(--accent)),inset 0 0 0 1px var(--accent);background:var(--bg-500)}
  .icard .nm{font-family:var(--font-display);font-weight:600;font-size:var(--t-lg);text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
  .icard .thumb{height:46px;display:flex;align-items:center;justify-content:center;color:var(--rc,var(--accent))}
  .icard .thumb .ico{width:36px;height:36px}
  .icard .ribbon{position:absolute;top:8px;right:8px;color:var(--ok);width:18px;height:18px}
  .icard .ic-foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #lobby{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:32px 0 40px;pointer-events:none}
  .home-top{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  .home-title{font-family:var(--font-display);font-weight:700;font-size:54px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--text);text-shadow:0 4px 24px rgba(0,0,0,.6);line-height:1}
  .home-title::after{content:"";display:block;width:120px;height:3px;margin:9px auto 0;
    background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  .home-sub{font-size:var(--t-md);color:var(--text-2);margin-top:4px}
  .home-meta{display:flex;gap:12px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);
    padding:7px 15px;font-family:var(--font-display);font-weight:600;font-size:var(--t-md);--ch:7px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .chip .ico{width:16px;height:16px;color:var(--accent)}
  #home-money-v{color:var(--gold)} #home-record-v{color:var(--text)}
  .home-buttons{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .lobby-bottom{display:flex;flex-direction:column;align-items:center;gap:18px}
  .select-bar{display:flex;align-items:center;gap:16px;pointer-events:auto;padding:8px 14px;--ch:10px}
  .select-bar .nav{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.04);color:var(--text);border:0;cursor:pointer;--ch:7px;transition:background .15s,color .15s;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .select-bar .nav:hover{background:var(--accent);color:var(--accent-ink)}
  .select-bar .nav:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .select-bar .nav .ico{width:20px;height:20px}
  .char-name{font-family:var(--font-display);font-weight:600;font-size:var(--t-xl);text-transform:uppercase;
    min-width:220px;text-align:center;letter-spacing:.04em}
  #play-btn{pointer-events:auto;padding:15px 40px;font-size:var(--t-lg)}
  #hud{position:fixed;left:16px;bottom:16px;z-index:10;background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line);
    padding:9px 13px;font-size:var(--t-xs);line-height:1.55;color:var(--text-2);--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #pause,#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(8,9,11,.9);text-align:center;padding:24px}
  #pause{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:var(--t-xl);color:var(--text)}
  #overlay-msg{max-width:520px;line-height:1.6;color:var(--text-2)}
  #overlay code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:4px;color:var(--gold)}
  #crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:18px;height:18px;pointer-events:none}
  #sight{position:fixed;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);z-index:12;
    border:1.5px solid rgba(120,235,150,.55);border-radius:50%;display:none;pointer-events:none}
  #sight::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
    transform:translate(-50%,-50%);background:#7dff9e;box-shadow:0 0 6px 1px rgba(120,255,150,.9)}
  #sight::after{content:"";position:absolute;left:50%;top:-9px;width:1.5px;height:7px;transform:translateX(-50%);
    background:rgba(120,235,150,.7);box-shadow:0 49px 0 rgba(120,235,150,.7)}
  #sight.show{display:block}
  #scope{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;transition:opacity .12s;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 30%, rgba(0,0,0,.45) 62%, rgba(0,0,0,.85) 100%)}
  #scope.show{opacity:1}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:#e8f0ff;box-shadow:0 0 3px rgba(0,0,0,.85)}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  #crosshair.aim{width:9px;height:9px}
  #hitmarker{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;color:var(--danger);
    font-size:26px;font-weight:900;opacity:0;transition:opacity .08s;pointer-events:none}
  #hitmarker.show{opacity:1}
  /* munitions (bas-droite) */
  #combat{position:fixed;right:16px;bottom:16px;z-index:10;background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line);
    padding:10px 16px;text-align:right;--ch:10px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .hud-ammo{display:flex;align-items:center;gap:7px;justify-content:flex-end;font-family:var(--font-display);line-height:1}
  .hud-ammo .ico{width:20px;height:20px;color:var(--accent)}
  .hud-ammo b{font-size:38px;font-weight:700;color:var(--text);font-feature-settings:'tnum' 1;line-height:1}
  .hud-ammo .mag{font-size:18px;color:var(--text-3)}
  .hud-line{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.07em;font-size:var(--t-xs);color:var(--text-2);margin-top:3px}
  .hud-line.reload{color:var(--accent)}
  #pickup-prompt{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;
    background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--accent);padding:9px 16px;
    color:var(--text);font-weight:600;font-size:var(--t-md);letter-spacing:.02em;pointer-events:none;--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #pickup-prompt kbd{display:inline-block;background:var(--accent);color:var(--accent-ink);
    padding:1px 8px;font-family:var(--font-display);font-weight:700;margin-right:8px;--ch:4px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #combo-hud{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:11;text-align:center;
    background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--accent);padding:6px 18px;color:var(--text);pointer-events:none;--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #combo-hud .cm{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--accent);line-height:1}
  #combo-hud .cc{font-family:var(--font-display);text-transform:uppercase;font-size:11px;letter-spacing:.1em;color:var(--text-2)}
  #combo-hud .cbar{height:3px;margin-top:5px;background:var(--accent)}
  #combo-hud.pulse{animation:comboPulse .22s ease-out}
  @keyframes comboPulse{0%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
  #wave-hud{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:10;background:var(--bg-700);
    box-shadow:inset 0 0 0 1px var(--line);padding:7px 18px;font-family:var(--font-display);text-transform:uppercase;
    font-size:var(--t-md);font-weight:600;letter-spacing:.06em;white-space:nowrap;color:var(--text-2);--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #wave-hud b{color:var(--accent)}
  #money-hud{position:fixed;left:16px;top:14px;z-index:10;background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line);
    padding:7px 15px;font-family:var(--font-display);font-size:var(--t-lg);font-weight:700;color:var(--gold);white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #money-hud .ico{width:17px;height:17px;color:var(--gold)}
  #radar{position:fixed;right:16px;top:14px;z-index:10;width:150px;height:150px;border-radius:50%;
    background:rgba(12,14,18,.66);box-shadow:inset 0 0 0 1px var(--line-2),0 4px 18px rgba(0,0,0,.5)}
  #wave-banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.82);z-index:21;
    font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:56px;
    color:var(--text);text-shadow:0 4px 24px rgba(0,0,0,.75),0 0 30px var(--accent-glow);
    opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;text-align:center;white-space:nowrap}
  #wave-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #vignette{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .12s;
    box-shadow:inset 0 0 140px 40px rgba(200,20,20,.85)}
  #vignette.show{opacity:1}
  #healthbar{position:fixed;left:16px;bottom:124px;width:240px;height:16px;z-index:10;
    background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden;--ch:5px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #health-fill{height:100%;width:100%;transition:width .15s;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 11px),linear-gradient(90deg,var(--ok),#7be0a0)}
  #health-fill.lo{background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 11px),linear-gradient(90deg,#ff9b2e,#ffc05a)}
  #health-fill.crit{background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 11px),linear-gradient(90deg,#ff4d4d,#ff7a6a)}
  #gameover{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(8,9,11,.93);text-align:center}
  #gameover::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
  .go-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 20px}
  .go-eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.3em;font-size:var(--t-sm);color:var(--danger)}
  .go-inner h1{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    font-size:64px;color:var(--text);line-height:.95;text-shadow:0 4px 30px rgba(0,0,0,.7)}
  #go-score{font-size:var(--t-md)}
  .go-tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .go-tile{background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);padding:12px 18px;min-width:96px;--ch:8px;
    display:flex;flex-direction:column;gap:3px;clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .go-tile span{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--text-3)}
  .go-tile b{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--text);font-feature-settings:'tnum' 1}
  .go-tile em{font-style:normal;font-size:11px;color:var(--text-2)}
  .go-tile.gold b{color:var(--gold)}
  .go-btns{display:flex;gap:12px;margin-top:2px}
  #go-restart,#go-menu{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:var(--t-md);
    padding:13px 28px;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:8px;--ch:9px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  #go-restart{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 8px 24px var(--accent-glow)}
  #go-restart .ico{width:16px;height:16px;color:var(--accent-ink)}
  #go-menu{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text)}
  #go-restart:focus-visible,#go-menu:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .panel{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(8,9,11,.9)}
  .panel-card{background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);padding:28px 36px;text-align:center;max-width:440px;--ch:14px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .panel-card h2{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:var(--t-2xl);margin-bottom:6px}
  .panel-card p{color:var(--text-2);line-height:1.6;margin-bottom:20px}
  .panel-back{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:var(--t-md);
    padding:11px 22px;cursor:pointer;border:0;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2));--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}

  .settings-card{max-width:430px;text-align:left}

  .set-row{display:flex;align-items:center;gap:14px;margin:16px 0}

  .set-val{flex:0 0 46px;text-align:right;font-family:var(--font-display);font-weight:700;color:var(--accent)}
  .set-toggle{flex:0 0 150px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:var(--t-sm);
    padding:9px 0;cursor:pointer;border:0;color:var(--text);background:var(--bg-600);box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s;--ch:7px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .set-toggle:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  .set-toggle:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .settings-card .panel-back{margin-top:14px}
  /* ====== Boutique « ARMURERIE » (refonte) ====== */
  #shop-panel{position:fixed;inset:0;z-index:45;background:var(--bg-800)}
  .shop-bg{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 36%, transparent 52%, rgba(0,0,0,.5)),
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px)}
  .shop-header{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-end;gap:12px;padding:14px 22px 12px;z-index:3}
  .shop-header .eyebrow{position:absolute;top:6px;left:24px}
  .shop-tabs{display:flex;gap:8px;margin-top:12px}
  .shop-tab{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:var(--t-md);

    background:var(--bg-700);transition:background .15s,color .15s;--ch:8px;clip-path:polygon(var(--ch) 0,100% 0,100% 100%,0 100%)}
  .shop-tab .ico{width:17px;height:17px}
  .shop-tab:hover{color:var(--text)}
  .shop-tab:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .shop-tab.active{color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 20px var(--accent-glow)}
  .shop-money2{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;
    font-size:var(--t-lg);color:var(--gold);background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);padding:8px 16px;--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .shop-money2 .ico{width:18px;height:18px;color:var(--gold)}
  .shop-close{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;
    color:var(--text);background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s;--ch:8px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .shop-close .ico{width:18px;height:18px}

  .shop-close:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .shop-nav-arrow{position:absolute;top:44%;transform:translateY(-50%);z-index:3;width:54px;height:54px;border:0;cursor:pointer;

    box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s;--ch:10px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .shop-nav-arrow .ico{width:26px;height:26px}
  .shop-nav-arrow.left{left:5%} .shop-nav-arrow.right{right:5%}
  .shop-nav-arrow:hover{background:var(--accent);color:var(--accent-ink)}
  .shop-nav-arrow:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  /* détail bas-centre (armes/perso) */
  .shop-info{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:11px;

    display:flex;align-items:center;gap:10px;justify-content:center}
  .shop-rating{font-family:var(--font-ui);font-size:13px;color:var(--gold);font-weight:600}
  .shop-statcards{display:flex;flex-direction:column;gap:3px;width:min(440px,86vw)}
  .shop-btns{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .shop-cta{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:var(--t-md);

    display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s,background .15s;--ch:9px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}

    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .shop-badge .ico{width:16px;height:16px}
  /* améliorations : pips + bouton (C-4 garde data-upg/data-pupg) */
  .shop-upgrades{display:flex;flex-direction:column;gap:8px;width:min(440px,86vw);background:var(--bg-700);
    box-shadow:inset 0 0 0 1px var(--line);padding:13px 16px;--ch:11px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}

  .upg-max{font-family:var(--font-display);font-size:12px;color:var(--ok);letter-spacing:.06em}
  .upg-btn{font-family:var(--font-display);font-weight:700;font-size:12px;padding:6px 12px;cursor:pointer;border:0;color:#231405;
    background:linear-gradient(135deg,#ffb02e,#ff7d2e);display:inline-flex;align-items:center;gap:5px;--ch:5px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .upg-btn .ico{width:12px;height:12px}
  .upg-btn:disabled{opacity:.4;cursor:default;filter:grayscale(.4)}
  .upg-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #231405}
  /* grille de cartes (accessoires/boost/danses) — C-3 : panneau docké à GAUCHE, perso visible à droite */
  .shop-info.grid{position:absolute;top:64px;bottom:24px;left:3%;right:auto;width:420px;max-width:42vw;
    overflow-y:auto;align-items:stretch;text-align:left;padding:14px;gap:12px;
    background:linear-gradient(180deg, rgba(16,18,22,.94), rgba(16,18,22,.82))}
  .shop-info.grid .shop-wname{font-size:var(--t-xl);justify-content:flex-start}
  .shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
  .subtabs{display:flex;gap:8px}
  .subtab{font-family:var(--font-display);text-transform:uppercase;font-weight:600;letter-spacing:.05em;font-size:var(--t-sm);
    padding:7px 14px;cursor:pointer;border:0;color:var(--text-2);background:var(--bg-700);--ch:6px;
    clip-path:polygon(var(--ch) 0,100% 0,100% 100%,0 100%)}
  .subtab.on{color:var(--accent-ink);background:var(--accent)}
  .subtab:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .ic-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ic-sub{font-size:12px;color:var(--text-2);font-weight:600}
  .icbtn{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.03em;
    padding:6px 10px;cursor:pointer;border:0;color:var(--text);background:var(--bg-700);box-shadow:inset 0 0 0 1px var(--line-2);
    display:inline-flex;align-items:center;gap:5px;transition:box-shadow .15s;--ch:5px;
    clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .icbtn .ico{width:13px;height:13px}
  .icbtn:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  .icbtn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .icbtn:disabled{opacity:.4;cursor:default}
  .icbtn.buy{color:var(--gold)} .icbtn.buy .ico{color:var(--gold)}
  .icbtn.on{color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
</style>
</head>

// ====== Helpers purs (sans three.js) ======
function cameraRelative(input, yaw){
  const f = input.forward||0, s = input.strafe||0;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  // avant = (sin,cos) ; droite = (cos,-sin)
  return { x: sin*f + cos*s, z: cos*f - sin*s };
}
const WALK_EPS = 0.05;
function locomotionState(speed, sprint){
  if (speed < WALK_EPS) return 'idle';
  return sprint ? 'run' : 'walk';
}
const ROLE_RE = { idle:/alert|idle|wait/i, walk:/walk|march/i, run:/run|sprint|course/i, attack:/attack|combat|punch|hit|skill/i, dead:/dead|death|die|mort/i };
function resolveClipRole(role, names){
  const re = ROLE_RE[role]; if (!re) return null;
  return names.find(n => re.test(n)) || null;
}
function pushOutCircleAABB(px, pz, r, box){
  const cx = Math.max(box.minX, Math.min(px, box.maxX));
  const cz = Math.max(box.minZ, Math.min(pz, box.maxZ));
  const dx = px - cx, dz = pz - cz;
  const d2 = dx*dx + dz*dz;
  if (d2 >= r*r) return { x:px, z:pz };           // pas de pénétration
  if (d2 > 1e-12){                                 // dehors en distance, on pousse le long de la normale
    const d = Math.sqrt(d2); const nx = dx/d, nz = dz/d;
    return { x: cx + nx*r, z: cz + nz*r };
  }
  // centre dans la boîte : pousser sur l'axe de moindre pénétration
  const pen = [
    { v: px - box.minX + r, x: box.minX - r, z: pz }, // vers -X
    { v: box.maxX - px + r, x: box.maxX + r, z: pz }, // vers +X
    { v: pz - box.minZ + r, x: px, z: box.minZ - r }, // vers -Z
    { v: box.maxZ - pz + r, x: px, z: box.maxZ + r }, // vers +Z
  ].sort((a,b)=>a.v-b.v)[0];
  return { x: pen.x, z: pen.z };
}
Object.assign(G.debug, { cameraRelative, locomotionState, resolveClipRole, pushOutCircleAABB });

function accessoryById(slot, id){ return (ACCESSORY_SLOTS[slot]||[]).find(a => a.id === id) || null; }
function accessoryItemById(id){ return HELMETS.find(a=>a.id===id) || COSTUMES.find(a=>a.id===id) || null; }
function findBoneNamed(root, exact, re){ let b=null; root.traverse(o=>{ if(o.isBone && o.name===exact) b=o; });
  if(!b) root.traverse(o=>{ if(o.isBone && !b && re.test(o.name)) b=o; }); return b; }
function clearBoneTag(root, tag){ const rm=[]; root.traverse(o=>{ if(o.userData && o.userData.accSlot===tag) rm.push(o); });
  for(const o of rm){ if(o.parent) o.parent.remove(o); } }
function clearAccessory(root, slot){ clearBoneTag(root, slot); }
// attache un mesh à un os : offset donné en MONDE (m) ; on annule rotation+échelle de l'os pour un placement intuitif
function attachToBoneWorld(bone, mesh, tag, off){
  bone.updateWorldMatrix(true, false);
  const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();
  bone.matrixWorld.decompose(wp, wq, ws);
  const inv = 1 / (ws.x || 1), iq = wq.clone().invert();
  mesh.scale.multiplyScalar(inv);                          // taille réelle (annule l'échelle monde de l'os)
  mesh.quaternion.copy(iq);                                // aligné MONDE au repos (suit ensuite les mouvements de l'os)
  const local = new THREE.Vector3(off.x, off.y, off.z).applyQuaternion(iq);
  mesh.position.set(local.x * inv, local.y * inv, local.z * inv);   // offset MONDE converti en local de l'os
  mesh.userData.accSlot = tag; bone.add(mesh);
}
function applyAccessories(root){
  if(!root) return;
  for(const slot of ['helmet','costume']){
    clearAccessory(root, slot);
    const a = accessoryById(slot, save.equipped[slot]); if(!a || !a.build) continue;
    const spec = ACCESSORY_BONE[slot], bone = findBoneNamed(root, spec.name, spec.re); if(!bone) continue;
    attachToBoneWorld(bone, a.build(), slot, spec.off);
  }
}
function buyAccessory(id){
  const a = accessoryItemById(id); if(!a) return false;
  if(save.ownedAccessories.includes(id) || save.money < a.price) return false;
  save.money -= a.price; G.money = save.money; save.ownedAccessories.push(id);
  persist(); updateMoneyHud(); updateHomeMeta(); return true;
}
function selectAccessory(slot, id){
  if(!ACCESSORY_SLOTS[slot] || !accessoryById(slot, id) || !save.ownedAccessories.includes(id)) return false;
  save.equipped[slot] = id; persist(); applyAccessories(model); return true;
}

// ====== Découverte par listing de dossier (serveur HTTP) ======
async function listDir(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Listing indisponible pour ' + url + ' (HTTP ' + res.status + ')');
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return [...doc.querySelectorAll('a')]
    .map(a => a.getAttribute('href'))
    .filter(h => h && !h.startsWith('/') && !h.startsWith('?') && !h.includes('://') && h !== '../');
}
const isGlb = h => /\.glb$/i.test(h);
const isImg = h => /\.(png|jpe?g|webp|gif)$/i.test(h);

// ====== Galerie partagée (IndexedDB 'studio3d', la même que studio.html / app.html) ======
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('studio3d',1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('models')) r.result.createObjectStore('models',{keyPath:'id'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbAll(){ return idb().then(db=>new Promise((res,rej)=>{ const rq=db.transaction('models','readonly').objectStore('models').getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); })); }
function dbGet(id){ return idb().then(db=>new Promise((res,rej)=>{ const rq=db.transaction('models','readonly').objectStore('models').get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); })); }
function dbPut(rec){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('models','readwrite'); tx.objectStore('models').put(rec); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
async function urlToDataURL(url){ try{ const blob=await (await fetch(url)).blob();
  return await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(''); fr.readAsDataURL(blob); }); }catch(e){ return ''; } }

// Ajoute les persos de /perso à la galerie partagée (idempotent : seulement si absents)
async function seedPersosToGallery() {
  let dirs;
  try { dirs = (await listDir(PERSO_DIR)).filter(h => h.endsWith('/')); } catch (e) { return; }
  for (const d of dirs) {
    const pid = decodeURIComponent(d.replace(/\/$/, ''));
    const id = 'perso:' + pid;
    if (await dbGet(id)) continue;
    let files; try { files = await listDir(PERSO_DIR + d); } catch (e) { continue; }
    const glb = files.find(isGlb); if (!glb) continue;
    const img = files.find(isImg);
    try {
      const bytes = await (await fetch(PERSO_DIR + d + glb)).arrayBuffer();
      const thumb = img ? await urlToDataURL(PERSO_DIR + d + img) : '';
      await dbPut({ id, name: prettyLabel(pid), format: 'glb', bytes, thumb, ts: 0, source: 'perso', date: 'dossier /perso' });
    } catch (e) { console.warn('seed perso KO', d, e); }
  }
}

// ====== Animation / retargeting (repris de app.html) ======
let anims = [];           // [{ key, label, icon, clip }]
let sourceModel=null, sourceBoneByName={}, sourceRest=null, sourceRestWorld=null;
let targetRest=null, targetRestWorld=null, targetBoneOrder=null;

function captureRest(root) {
  const map = {};
  root.traverse(o => { if (o.isBone) map[o.name] = { q: o.quaternion.clone(), p: o.position.clone() }; });
  return map;
}
function captureRestWorld(root) {
  root.updateMatrixWorld(true);
  const map = {}; const q = new THREE.Quaternion();
  root.traverse(o => { if (o.isBone) { o.getWorldQuaternion(q); map[o.name] = q.clone(); } });
  return map;
}
function boneOrder(root) {
  const list = [];
  root.traverse(o => { if (o.isBone) list.push({ name: o.name, parent: (o.parent && o.parent.isBone) ? o.parent.name : null }); });
  return list;
}

// Retargeting espace-monde : applique un clip du rig source à n'importe quel rig cible
function retargetClipWorld(raw) {
  const dur = raw.duration;
  const n = Math.max(2, Math.round(dur * 30) + 1);
  const srcMixer = new THREE.AnimationMixer(sourceModel);
  srcMixer.clipAction(raw).play();

  const samples = {}; for (const b of targetBoneOrder) samples[b.name] = [];
  const times = [];
  const qWsrc = new THREE.Quaternion(), tmp = new THREE.Quaternion();
  const tgtWorld = {};

  for (let f = 0; f < n; f++) {
    const t = (f / (n - 1)) * dur;
    times.push(t);
    srcMixer.setTime(t);
    sourceModel.updateMatrixWorld(true);
    for (const b of targetBoneOrder) {
      const sBone = sourceBoneByName[b.name];
      const sRW = sourceRestWorld[b.name], tRW = targetRestWorld[b.name];
      if (!sBone || !sRW || !tRW) { samples[b.name].push(null); continue; }
      sBone.getWorldQuaternion(qWsrc);
      tmp.copy(qWsrc).multiply(sRW.clone().invert()).multiply(tRW);     // qWsrc · sRW⁻¹ · tRW
      tgtWorld[b.name] = tmp.clone();
      const localQ = b.parent && tgtWorld[b.parent]
        ? tgtWorld[b.parent].clone().invert().multiply(tmp)
        : tmp.clone();
      samples[b.name].push(localQ);
    }
  }
  srcMixer.stopAllAction();

  const tracks = [];
  const timesArr = Float32Array.from(times);
  for (const name in samples) {
    const arr = samples[name];
    if (!arr.length || arr.some(q => !q)) continue;
    const vals = new Float32Array(arr.length * 4);
    for (let i = 0; i < arr.length; i++) { const q = arr[i]; vals[i*4]=q.x; vals[i*4+1]=q.y; vals[i*4+2]=q.z; vals[i*4+3]=q.w; }
    tracks.push(new THREE.QuaternionKeyframeTrack(name + '.quaternion', timesArr, vals));
  }
  // bassin : seulement le rebond vertical, recentré X/Z (anim sur place)
  const hp = raw.tracks.find(tt => tt.name === ROOT_BONE + '.position');
  const sP = sourceRest[ROOT_BONE]?.p, tP = targetRest[ROOT_BONE]?.p;
  if (hp && sP && tP) {
    const ratio = sP.y ? tP.y / sP.y : 1;
    const vals = Float32Array.from(hp.values);
    for (let i = 0; i < vals.length; i += 3) { vals[i] = tP.x; vals[i+1] = tP.y + (vals[i+1] - sP.y) * ratio; vals[i+2] = tP.z; }
    tracks.push(new THREE.VectorKeyframeTrack(ROOT_BONE + '.position', Array.from(hp.times), vals));
  }
  return new THREE.AnimationClip(raw.name, raw.duration, tracks);
}

async function loadAnims(animFiles) {
  anims = [];
  for (const f of animFiles) {
    try {
      const g = await loader.loadAsync(ANIM_DIR + f);
      const clip = g.animations[0];
      if (!clip) continue;
      const key = animKeyFromFile(f);
      clip.name = key;
      anims.push({ key, label: prettyLabel(key), icon: iconFor(f), clip });
      // 1er fichier = squelette source partagé (les clips sont créés sur ce rig)
      if (!sourceModel) {
        sourceModel = g.scene;
        sourceRest = captureRest(g.scene);
        sourceRestWorld = captureRestWorld(g.scene);
        g.scene.traverse(o => { if (o.isBone) sourceBoneByName[o.name] = o; });
      }
    } catch (e) { console.warn('anim KO', f, e); }
  }
  anims.sort((a, b) => a.label.localeCompare(b.label));
}

// idle dérivé : rapproche chaque pose de la pose de repos cible (repli si pas d'Alert)
function deriveIdle(clip){
  const amp = 0.18;
  const tracks = clip.tracks.map(tr=>{
    if(!tr.name.endsWith('.quaternion')) return tr.clone();
    const boneName = tr.name.slice(0, tr.name.lastIndexOf('.'));
    const rest = targetRest[boneName] && targetRest[boneName].q;
    if(!rest) return tr.clone();
    const v = Float32Array.from(tr.values);
    const q = new THREE.Quaternion(), o = new THREE.Quaternion();
    for(let i=0;i<v.length;i+=4){
      q.set(v[i],v[i+1],v[i+2],v[i+3]);
      o.copy(rest).slerp(q, amp);
      v[i]=o.x; v[i+1]=o.y; v[i+2]=o.z; v[i+3]=o.w;
    }
    return new THREE.QuaternionKeyframeTrack(tr.name, Float32Array.from(tr.times), v);
  });
  return new THREE.AnimationClip('idle_derived', clip.duration, tracks);
}

const actions = { idle:null, walk:null, run:null };
async function spawnModel(char){
  const url = URL.createObjectURL(new Blob([char.bytes]));
  const gltf = await loader.loadAsync(url); URL.revokeObjectURL(url);
  const m = gltf.scene;
  m.traverse(o => { if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  applyAccessories(m);                                // accessoires 3D (#26) : casque/costume attachés dès le spawn
  applyBoosts(m);                                      // visuels de boost (#28) : bottes/gilet/médaille
  targetRest = captureRest(m); targetRestWorld = captureRestWorld(m); targetBoneOrder = boneOrder(m);
  const box = new THREE.Box3().setFromObject(m);
  const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
  const s = 1.8/(size.y||1); m.scale.setScalar(s);
  m.position.sub(center.multiplyScalar(s)); m.position.y += (size.y*s)/2;
  m.rotation.y = 0;
  if(mixer){ mixer.stopAllAction(); mixer = null; }   // lobby : l'idle est (re)posé par playLobbyIdle
  lobbyIdle = false;
  if(model){ scene.remove(model); heldWeapon = null; }   // nouveau modèle => l'arme se ré-attache à la partie suivante
  model = m; scene.add(model);
  groundY = m.position.y; velY = 0; grounded = true;
  applyShopVisibility();   // si la boutique (vitrine d'arme) est ouverte, masque ce nouveau perso
}
// joue une anim idle sur le perso du lobby (plus de T-pose) — non-bloquant ; sauté en mode test rapide
async function playLobbyIdle(){
  if(!model || window.__FAST_WEAPON__) return;
  const target = model;
  try { if(!anims.length) await loadAnims((await listDir(ANIM_DIR)).filter(isGlb)); } catch(e){ return; }
  if(model !== target) return;                          // un autre perso a été sélectionné entre-temps
  // lobby = perso sans arme → pose debout détendue (bras le long du corps) : 1er frame de "Agree_Gesture" figé.
  // (l'idle EN JEU reste "Alert" — correct car le perso tient alors son arme.)
  const calm = anims.find(a => a.key === 'Agree_Gesture');
  const clip = calm ? retargetClipWorld(calm.clip) : retargetRole('idle');
  if(clip){ mixer = new THREE.AnimationMixer(model); const act = mixer.clipAction(clip);
    if(calm){ act.play(); act.paused = true; act.time = 0.05; mixer.update(0); }   // pose figée naturelle
    else act.play();
    lobbyIdle = true; }
}
G.debug.lobbyAnimated = () => lobbyIdle;
function retargetRole(role){
  const names = anims.map(a => a.key);
  const key = resolveClipRole(role, names);
  let raw = key ? anims.find(a=>a.key===key)?.clip : null;
  if(!raw && role==='run') raw = anims.find(a=>resolveClipRole('walk',[a.key]))?.clip; // run -> walk
  if(!raw && role==='walk') raw = anims.find(a=>resolveClipRole('run',[a.key]))?.clip;  // walk -> run
  if(!raw && role==='idle'){ const w = anims.find(a=>resolveClipRole('walk',[a.key]))?.clip; return w?deriveIdle(retargetClipWorld(w)):null; }
  if(!raw) return null;
  return retargetClipWorld(raw);
}

function applyLook(dx, dy){
  camYaw -= dx * 0.0025 * lookSensitivity;
  // 1re personne : souris vers le haut (dy<0) => regarder vers le haut (pitch ↑) — non inversé.
  // 3e personne : on conserve l'orbite existante.
  camPitch += (view === 'first' ? -dy : dy) * 0.0025 * lookSensitivity;
  clampPitch();
}
addEventListener('mousemove', e => {
  if(document.pointerLockElement !== canvasEl) return;
  applyLook(e.movementX, e.movementY);
});
G.debug.look = (dx, dy) => applyLook(dx, dy);
const AIM_DIST = 3.0, SHOULDER = 0.6;
let shake = 0;
function updateCamera(dt){
  if(!model) return;
  if(view === 'first'){
    const p = model.position;
    const eye = p.y + EYE_HEIGHT;
    camDist += (0 - camDist) * Math.min(1, dt*10);
    camera.position.set(p.x, eye, p.z);
    if(shake > 0){ const k = shake*0.06; camera.position.x += (Math.random()-0.5)*k; camera.position.y += (Math.random()-0.5)*k; shake = Math.max(0, shake - dt*6); }
    const look = new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
    camera.lookAt(camera.position.x + look.x, camera.position.y + look.y, camera.position.z + look.z);
    return;
  }
  const targetDist = input.aim ? AIM_DIST : CAM_DIST;
  camDist += (targetDist - camDist) * Math.min(1, dt*10);
  const p = model.position;
  const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
  const sh = input.aim ? SHOULDER : 0;
  const ty = p.y + 1.5;
  const look = new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
  const desired = new THREE.Vector3(
    p.x - look.x*camDist + right.x*sh,
    ty + look.y*camDist,
    p.z - look.z*camDist + right.z*sh);
  camera.position.lerp(desired, Math.min(1, dt*8));
  if(shake > 0){ const k = shake*0.12; camera.position.x += (Math.random()-0.5)*k; camera.position.y += (Math.random()-0.5)*k; shake = Math.max(0, shake - dt*6); }
  camera.lookAt(p.x + right.x*sh, ty, p.z + right.z*sh);
}

// ====== Contrôleur + machine d'état locomotion ======
const WALK_SPEED = 2.4, RUN_SPEED = 5.4, TURN_LERP = 12;
let curLoco = 'idle';
let danceActionCache = {}, dancing = false, danceAction = null, danceEndAt = 0;   // danses (#27)
function setLoco(state){
  if(state===curLoco) return;
  const next = actions[state] || actions.idle;
  const prev = actions[curLoco];
  if(next){ next.reset().play(); if(prev && prev!==next) prev.crossFadeTo(next, 0.2, false); }
  curLoco = state; G.locomotion = state;
}
function updateController(dt){
  if(G.phase!=='playing' || !model) return;
  if(dancing){                                                  // danse en cours (#27) : fige la loco
    const moving = input.forward || input.back || input.left || input.right;
    if(nowS() >= danceEndAt || moving) endDance();              // fin (durée écoulée ou mouvement)
    else return;
  }
  const f = (input.forward?1:0) - (input.back?1:0);
  const s = (input.left?1:0) - (input.right?1:0); // +s = droite écran (corrige l'inversion gauche/droite)
  let speed = 0;
  if(f||s){
    const dir = cameraRelative({forward:f, strafe:s}, camYaw);
    const len = Math.hypot(dir.x, dir.z) || 1;
    const vx = dir.x/len, vz = dir.z/len;
    speed = (input.sprint ? RUN_SPEED : WALK_SPEED) * speedMult;
    model.position.x += vx*speed*dt;
    model.position.z += vz*speed*dt;
    const target = Math.atan2(vx, vz);
    let a = model.rotation.y;
    let diff = ((target - a + Math.PI)%(Math.PI*2)) - Math.PI;
    model.rotation.y = a + diff*Math.min(1, dt*TURN_LERP);
  }
  // bornes de map
  model.position.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, model.position.x));
  model.position.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, model.position.z));
  // collision obstacles
  for(const b of obstacles){
    const o = pushOutCircleAABB(model.position.x, model.position.z, PLAYER_R, b);
    model.position.x = o.x; model.position.z = o.z;
  }
  // saut (vertical, gravité)
  if(!grounded){
    velY -= GRAVITY*dt;
    model.position.y += velY*dt;
    if(model.position.y <= groundY){ model.position.y = groundY; velY = 0; grounded = true; }
  }
  setLoco(locomotionState(speed, input.sprint));
}

// ====== Combat : tir hitscan, cibles (entités), munitions, juice ======
const RESPAWN_DELAY = 2.0, SHOT_RANGE = 80;
let ammo = 12, reloading = false, reloadAt = 0, lastShot = -1, score = 0;
const targets = [];                 // entités-données : { id, mesh, alive, respawnAt }
const _ray = new THREE.Raycaster();
const nowS = () => performance.now() / 1000;

function spawnTarget(x, y, z){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, 1.4, 16),
    new THREE.MeshStandardMaterial({ color:0xff4d4d, emissive:0x551111, roughness:0.5 }));
  mesh.position.set(x, y, z); mesh.castShadow = true; scene.add(mesh);
  mesh.updateMatrixWorld();   // matrice monde prête immédiatement (raycast dès le 1er tir)
  const t = { id: targets.length, mesh, alive:true, respawnAt:0 };
  targets.push(t); return t;
}
function clearTargets(){ for(const t of targets) scene.remove(t.mesh); targets.length = 0; }
function spawnDefaultTargets(){
  clearTargets();
  spawnTarget(-6, 0.7, 8); spawnTarget(0, 0.7, 14); spawnTarget(6, 0.7, 9);
  spawnTarget(-9, 0.7, -3); spawnTarget(9, 0.7, 2);
}
function hitTarget(t){
  t.alive = false; t.mesh.visible = false; t.respawnAt = nowS() + RESPAWN_DELAY;
  score++; G.score = score; flashHitMarker();
}
function tryFire(){
  if(G.phase!=='playing' || reloading || ammo <= 0) return false;
  if(nowS() - lastShot < curCooldown) return false;
  lastShot = nowS(); ammo--; G.ammo = ammo; shake = 1; playSound('shot'); weaponRecoil = curRecoil;
  _ray.setFromCamera({ x:0, y:0 }, camera);                 // rayon = centre de l'écran (viseur)
  const shoot = [];
  for(const t of targets) if(t.alive) shoot.push(t.mesh);
  for(const e of enemies) if(e.alive) shoot.push(e.hitbox);
  const hits = _ray.intersectObjects(shoot, false);
  const end = hits.length ? hits[0].point.clone()
    : _ray.ray.origin.clone().add(_ray.ray.direction.clone().multiplyScalar(SHOT_RANGE));
  spawnTracer(_ray.ray.origin, end);
  if(hits.length){
    const obj = hits[0].object;
    const t = targets.find(t => t.mesh === obj);
    if(t) hitTarget(t);
    else { const e = enemies.find(e => e.hitbox === obj);
      if(e){ const relY = hits[0].point.y - e.root.position.y, hz = hitZoneDamage(relY), dmg = Math.round(hz.damage * curDmgMult);
        damageEnemy(e, dmg); spawnDamageNumber(hits[0].point, dmg, hz.zone === 'head'); } }
  }
  return true;
}
function reload(){
  if(reloading || ammo === curMag || G.phase!=='playing') return;
  reloading = true; reloadAt = nowS() + curReload; playSound('reload');
}
// juice : trace de balle qui s'efface
const tracers = [];
// ====== Nombres de dégâts flottants (#30) : sprite au point d'impact, monte + fade ======
const damageNumbers = []; let lastDmgNum = null;
function makeNumberSprite(text, color, scale){
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const c = cv.getContext('2d'); c.font = 'bold 46px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 7; c.strokeStyle = 'rgba(0,0,0,.85)'; c.strokeText(text, 64, 32);
  c.fillStyle = color; c.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  sp.scale.set(scale, scale*0.5, 1); return sp;
}
const DMGNUM_DUR = 0.8;
function spawnDamageNumber(pos, amount, crit){
  const sp = makeNumberSprite(String(amount), crit ? '#ffcf3f' : '#ffffff', crit ? 1.1 : 0.8);
  sp.position.copy(pos); sp.position.y += 0.12; sp.renderOrder = 999; scene.add(sp);
  damageNumbers.push({ sp, start: nowS(), y0: sp.position.y }); lastDmgNum = { amount, crit };
}
function updateDamageNumbers(){   // expiration à l'horloge (indépendant du frame-rate / throttling)
  const t = nowS();
  for(let i=damageNumbers.length-1;i>=0;i--){ const d = damageNumbers[i], e = (t - d.start) / DMGNUM_DUR;
    if(e >= 1){ scene.remove(d.sp); d.sp.material.map.dispose(); d.sp.material.dispose(); damageNumbers.splice(i,1); continue; }
    d.sp.position.y = d.y0 + e * 0.9; d.sp.material.opacity = 1 - e; }
}
G.debug.damageNumberCount = () => damageNumbers.length;
G.debug.lastDamageNumber = () => lastDmgNum;
function spawnTracer(from, to){
  const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:0xfff1a8, transparent:true, opacity:0.9 }));
  scene.add(line); tracers.push({ line, life:0.08 });
}
function updateTracers(dt){
  for(let i=tracers.length-1;i>=0;i--){
    const tr = tracers[i]; tr.life -= dt;
    tr.line.material.opacity = Math.max(0, tr.life/0.08) * 0.9;
    if(tr.life<=0){ scene.remove(tr.line); tr.line.geometry.dispose(); tr.line.material.dispose(); tracers.splice(i,1); }
  }
}

          else pe.classList.add('hidden'); }

// ligne de vue : le segment (ax,az)->(bx,bz) est-il dégagé d'obstacles ? (Liang-Barsky 2D)
function segHitsAABB(ax, az, bx, bz, b){
  const dx = bx - ax, dz = bz - az; let t0 = 0, t1 = 1;
  const p = [-dx, dx, -dz, dz], q = [ax - b.minX, b.maxX - ax, az - b.minZ, b.maxZ - az];
  for(let i = 0; i < 4; i++){
    if(p[i] === 0){ if(q[i] < 0) return false; }
    else { const r = q[i] / p[i];
      if(p[i] < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
      else { if(r < t0) return false; if(r < t1) t1 = r; } }
  }
  return true;
}
function hasLineOfSight(ax, az, bx, bz){
  for(const b of obstacles) if(segHitsAABB(ax, az, bx, bz, b)) return false;
  return true;
}
// ====== IA #11 : contournement (flank) + mise à couvert (peek) — helpers purs ======
// point d'approche décalé perpendiculairement à la ligne ennemi->joueur (contournement)
function flankTarget(px, pz, ex, ez, side){
  const dx=px-ex, dz=pz-ez, len=Math.hypot(dx,dz)||1, perpx=-dz/len, perpz=dx/len;
  const off = Math.min(4, len*0.5) * (side||1);
  return { x: px + perpx*off, z: pz + perpz*off };
}
function segClear(ax, az, bx, bz, obs){ for(const b of obs) if(segHitsAABB(ax, az, bx, bz, b)) return false; return true; }
// si la vue directe est coupée, renvoie un point latéral qui dégage la ligne de tir (mise à couvert / peek)
function peekTarget(ex, ez, px, pz, obs){
  if(segClear(ex,ez,px,pz,obs)) return { x:ex, z:ez };
  const dx=px-ex, dz=pz-ez, len=Math.hypot(dx,dz)||1, perpx=-dz/len, perpz=dx/len;
  for(const off of [2,-2,4,-4,6,-6]){ const tx=ex+perpx*off, tz=ez+perpz*off; if(segClear(tx,tz,px,pz,obs)) return { x:tx, z:tz }; }
  return { x:px, z:pz };
}

// ====== Mini-carte / radar (#21) : blips ennemis autour du joueur, orientés regard ======
const RADAR_RANGE = 28, RADAR_R = 70;
const RADAR_COLORS = { shooter:'#ffb84d', rusher:'#ff5b5b', tank:'#c07bff' };
// projection pure monde->radar : "haut" = direction face caméra (mêmes axes que la caméra)
function radarBlip(ex, ez, px, pz, yaw, range, radius){
  const dx=ex-px, dz=ez-pz;
  const right = dx*Math.cos(yaw) - dz*Math.sin(yaw);
  const up    = dx*Math.sin(yaw) + dz*Math.cos(yaw);
  const dist = Math.hypot(dx,dz), s = radius/range;
  let bx = right*s, by = up*s; const inRange = dist <= range;
  if(!inRange){ const l = Math.hypot(bx,by)||1; bx = bx/l*radius; by = by/l*radius; }   // clampé au bord
  return { x:bx, y:by, inRange, dist };
}
let radarCtx = null;
function updateRadar(){
  const cv = document.getElementById('radar'); if(!cv || !model) return;
  if(!radarCtx) radarCtx = cv.getContext('2d');
  const ctx = radarCtx, C = cv.width/2, s = RADAR_R/RADAR_RANGE;
  const px=model.position.x, pz=model.position.z, cy=camYaw, cos=Math.cos(cy), sin=Math.sin(cy);
  ctx.clearRect(0,0,cv.width,cv.height);
  // anneau + croix
  ctx.strokeStyle='rgba(150,160,175,.30)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(C,C,RADAR_R,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(150,160,175,.13)';
  ctx.beginPath(); ctx.moveTo(C,C-RADAR_R); ctx.lineTo(C,C+RADAR_R); ctx.moveTo(C-RADAR_R,C); ctx.lineTo(C+RADAR_R,C); ctx.stroke();
  // contenu clippé au disque
  ctx.save(); ctx.beginPath(); ctx.arc(C,C,RADAR_R,0,Math.PI*2); ctx.clip();
  // minimap du niveau : obstacles proches (quads gris, orientés regard)
  const toRadar = (wx,wz) => { const dx=wx-px, dz=wz-pz; return [C + (dx*cos - dz*sin)*s, C - (dx*sin + dz*cos)*s]; };
  ctx.fillStyle='rgba(150,170,210,.16)';
  for(const b of obstacles){
    const ocx=(b.minX+b.maxX)/2, ocz=(b.minZ+b.maxZ)/2;
    if(Math.hypot(ocx-px,ocz-pz) > RADAR_RANGE + Math.max(b.maxX-b.minX, b.maxZ-b.minZ)) continue;
    const c1=toRadar(b.minX,b.minZ), c2=toRadar(b.maxX,b.minZ), c3=toRadar(b.maxX,b.maxZ), c4=toRadar(b.minX,b.maxZ);
    ctx.beginPath(); ctx.moveTo(c1[0],c1[1]); ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.lineTo(c4[0],c4[1]); ctx.closePath(); ctx.fill();
  }
  // ennemis (couleur par type, clamp au bord si hors portée)
  for(const e of enemies){ if(!e.alive) continue;
    const b = radarBlip(e.root.position.x, e.root.position.z, px, pz, cy, RADAR_RANGE, RADAR_R);
    ctx.globalAlpha = b.inRange ? 1 : 0.5; ctx.fillStyle = RADAR_COLORS[e.type] || '#ff5b5b';
    ctx.beginPath(); ctx.arc(C + b.x, C - b.y, b.inRange ? 4 : 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
  // joueur : triangle vert pointant vers le haut (direction du regard)
  ctx.fillStyle='#7dff9e'; ctx.beginPath(); ctx.moveTo(C,C-6); ctx.lineTo(C-4,C+5); ctx.lineTo(C+4,C+5); ctx.closePath(); ctx.fill();
}

function enemyTryShoot(e, dt){
  e.shootCd = (e.shootCd || 0) - dt;
  if(e.shootCd > 0) return;
  let from;
  if(e.muzzle){ e.muzzle.updateMatrixWorld(true); from = e.muzzle.getWorldPosition(new THREE.Vector3()); }
  else from = new THREE.Vector3(e.root.position.x, e.root.position.y + 1.4, e.root.position.z);
  const to   = new THREE.Vector3(model.position.x, model.position.y + 1.4, model.position.z);
  spawnTracer(from, to); playSound('enemyShot');                    // traceur (depuis le canon) + son
  if(e.muzzleFlash){ e.muzzleFlash.visible = true; e.muzzleFlashUntil = nowS() + 0.05; }   // flash de bouche bref
  const dist = Math.hypot(to.x - from.x, to.z - from.z);
  const acc = enemyAccOverride != null ? enemyAccOverride
            : ENEMY_ACCURACY * Math.max(0.4, Math.min(1, 1 - dist / SHOOT_RANGE * 0.4));
  if(Math.random() < acc) damagePlayer(Math.round(ENEMY_DAMAGE * (e.spec ? e.spec.damageMult : 1)));
  // rafale (#11) : enchaîne spec.burst cartouches espacées, puis longue pause
  e.burstLeft = (e.burstLeft || 1) - 1;
  if(e.burstLeft > 0) e.shootCd = ENEMY_BURST_GAP;
  else { e.burstLeft = (e.spec && e.spec.burst) || 1; e.shootCd = ENEMY_FIRE_CD; }
}
// mêlée (#11) : le rusher frappe au contact, sur cooldown
function enemyMeleeAttack(e, dt){
  e.meleeCd = (e.meleeCd || 0) - dt;
  const dist = Math.hypot(model.position.x - e.root.position.x, model.position.z - e.root.position.z);
  if(e.meleeCd > 0 || dist > MELEE_RANGE) return;
  e.meleeCd = MELEE_CD;
  damagePlayer(Math.round(MELEE_DAMAGE * (e.spec ? e.spec.damageMult : 1)));
}

function makeHitbox(scale = 1){

    new THREE.MeshBasicMaterial({ visible:false }));        // non rendu mais raycastable (mesh.visible reste true)

function randomSpawn(){

  const px = model ? model.position.x : 0, pz = model ? model.position.z : 0;
  const x = Math.max(-MAP_HALF*0.95, Math.min(MAP_HALF*0.95, px + Math.cos(a)*r));
  const z = Math.max(-MAP_HALF*0.95, Math.min(MAP_HALF*0.95, pz + Math.sin(a)*r));

function rigHeightOf(obj){
  obj.updateMatrixWorld(true);
  let lo = Infinity, hi = -Infinity; const v = new THREE.Vector3();
  obj.traverse(o => { if(o.isBone){ o.getWorldPosition(v); lo = Math.min(lo, v.y); hi = Math.max(hi, v.y); } });
  return { lo, hi, h:(hi - lo) || 1 };
}
let enemyLabel = '';
async function buildEnemyAssets(playerChar){
  // ennemi = perso "enemie" en priorité ; sinon un perso différent du joueur
  const pick = allCharacters.find(c => /enem/i.test(c.label)) || allCharacters.find(c => c.id !== playerChar.id) || playerChar;
  enemyLabel = pick.label;
  const url = URL.createObjectURL(new Blob([pick.bytes]));
  const gltf = await loader.loadAsync(url); URL.revokeObjectURL(url);
  const inner = gltf.scene;
  inner.traverse(o => { if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  // ÉCHELLE basée sur le SQUELETTE (la bbox géométrique sous-estime certains modèles skinnés -> géant).
  // Cible = la taille réelle du joueur, pour qu'ils fassent la même taille.
  const targetH = model ? rigHeightOf(model).h : 1.7;
  inner.scale.setScalar(targetH / rigHeightOf(inner).h);
  // poser les pieds (os le plus bas) au sol, bassin centré en X/Z
  inner.updateMatrixWorld(true);
  let lo = Infinity, hips = null; const v = new THREE.Vector3();
  inner.traverse(o => { if(o.isBone){ o.getWorldPosition(v); lo = Math.min(lo, v.y); if(o.name===ROOT_BONE) hips = v.clone(); } });
  if(hips){ inner.position.x -= hips.x; inner.position.z -= hips.z; }
  inner.position.y -= lo;
  const wrapper = new THREE.Group(); wrapper.add(inner);
  enemyBase = wrapper;
  // retarget des 4 rôles contre le rig ennemi (swap temporaire des globals cible)
  const sr = targetRest, srw = targetRestWorld, so = targetBoneOrder;
  targetRest = captureRest(inner); targetRestWorld = captureRestWorld(inner); targetBoneOrder = boneOrder(inner);
  enemyClips = { idle:retargetRole('idle'), walk:retargetRole('walk'), run:retargetRole('run'), attack:retargetRole('attack'), dead:retargetRole('dead') };
  targetRest = sr; targetRestWorld = srw; targetBoneOrder = so;
}
function clearEnemies(){ for(const e of enemies){ scene.remove(e.root); scene.remove(e.hitbox); } enemies.length = 0; }
function createEnemies(count = ENEMY_COUNT, hp = ENEMY_HP, comp = null){
  clearEnemies();
  for(let i=0;i<count;i++){
    const type = (comp && comp[i]) || 'shooter';
    const spec = ENEMY_TYPES[type] || ENEMY_TYPES.shooter;
    const root = cloneSkeleton(enemyBase);
    if(spec.scale !== 1) root.scale.multiplyScalar(spec.scale);     // tank plus grand, rusher plus petit
    const mats = [];
    // matériaux clonés par ennemi (flash indépendant) ; halo emissif coloré = lecture du type
    root.traverse(o => { if(o.isMesh){
      o.castShadow=true; o.receiveShadow=true;
      const cloneMat = m => { const c = m.clone();
        if(c.emissive){ if(spec.glow != null) c.emissive.setHex(spec.glow); mats.push({ mat:c, base:c.emissive.clone() }); }
        return c; };
      o.material = Array.isArray(o.material) ? o.material.map(cloneMat) : cloneMat(o.material);
    } });
    const mixer = new THREE.AnimationMixer(root);
    const actions = {};
    for(const k of ['idle','walk','run','attack','dead']) if(enemyClips[k]) actions[k] = mixer.clipAction(enemyClips[k]);
    const hbY = 0.9 * spec.scale;
    const hitbox = makeHitbox(spec.scale);
    const sp = randomSpawn(); root.position.set(sp.x, ENEMY_FOOT_Y, sp.z);
    hitbox.position.set(sp.x, ENEMY_FOOT_Y + hbY, sp.z); hitbox.updateMatrixWorld(); // prêt au raycast dès la 1re frame
    const ehp = Math.round(hp * spec.hpMult);
    const e = { id:i, type, spec, root, mixer, actions, hitbox, mats, hp:ehp, maxHp:ehp, hbY, state:'patrol', alive:true,
                loco:'idle', target:null, lostFor:0, flashUntil:0, weaponId:weaponIdForType(type), looted:false,
                burstLeft:spec.burst || 1, flankSide:(i%2===0)?1:-1, meleeCd:0 };
    actions.idle?.play();
    attachWeaponToEnemy(e);                       // no-op si le template n'est pas encore prêt
    scene.add(root); enemies.push(e);
  }
}
function updateEnemies(dt){
  if(G.phase!=='playing' || !model) return;
  const px = model.position.x, pz = model.position.z;
  for(const e of enemies){
    if(e.state === 'dead'){
      if(!e.actions.dead) e.root.rotation.x = Math.min(1.45, e.root.rotation.x + dt*3); // repli : bascule en code si pas d'anim Dead
      e.mixer.update(dt);                                  // le corps reste jusqu'au début de la vague suivante
      // garde le corps SUR le sol (l'anim Dead descend le bassin et l'enfoncerait dans le sol)
      e.root.updateMatrixWorld(true);
      let lo = Infinity; const bp = new THREE.Vector3();
      e.root.traverse(o => { if(o.isBone){ o.getWorldPosition(bp); if(bp.y < lo) lo = bp.y; } });
      if(isFinite(lo) && lo < ENEMY_FOOT_Y + 0.05) e.root.position.y += (ENEMY_FOOT_Y + 0.05 - lo);
      continue;
    }
    const dx = px - e.root.position.x, dz = pz - e.root.position.z;
    const dist = Math.hypot(dx, dz);
    const los = hasLineOfSight(e.root.position.x, e.root.position.z, px, pz);
    const spec = e.spec || ENEMY_TYPES.shooter, ex = e.root.position.x, ez = e.root.position.z;
    let desired = 'idle';
    if(spec.melee){
      // RUSHER : poursuite agressive avec contournement, frappe au contact
      if(e.state === 'melee'){ if(dist > MELEE_RANGE*1.4) e.state = 'chase'; }
      else if(e.state === 'chase'){
        if(dist <= MELEE_RANGE) e.state = 'melee';
        else if(dist > LOSE_RADIUS){ e.lostFor += dt; if(e.lostFor >= LOSE_TIME){ e.state = 'patrol'; e.lostFor = 0; pickPatrol(e); } }
        else e.lostFor = 0;
      } else { // patrol
        if(dist <= DETECT_RADIUS){ e.state = 'chase'; e.lostFor = 0; }
      }
      if(e.state === 'chase'){
        let tx = px, tz = pz;
        if(dist > MELEE_RANGE*1.5){ const f = flankTarget(px, pz, ex, ez, e.flankSide); tx = f.x; tz = f.z; }   // contournement
        moveToward(e, tx, tz, ENEMY_RUN*spec.speedMult, dt); desired = 'run';
      } else if(e.state === 'melee'){ faceToward(e, px, pz, dt); enemyMeleeAttack(e, dt); desired = 'attack'; }
      else { if(!e.target || Math.hypot(e.target.x - ex, e.target.z - ez) < 0.6) pickPatrol(e);
        moveToward(e, e.target.x, e.target.z, ENEMY_WALK*spec.speedMult, dt); desired = 'walk'; }
    } else {
      // RANGED (shooter/tank) : transitions à hystérésis + mise à couvert si vue coupée + tir en rafale
      if(e.state === 'shoot'){
        if(dist > SHOOT_RANGE*1.25 || !los) e.state = 'chase';
      } else if(e.state === 'chase'){
        if(dist <= SHOOT_RANGE && los) e.state = 'shoot';
        else if(dist > LOSE_RADIUS){ e.lostFor += dt; if(e.lostFor >= LOSE_TIME){ e.state = 'patrol'; e.lostFor = 0; pickPatrol(e); } }
        else e.lostFor = 0;
      } else { // patrol
        if(dist <= DETECT_RADIUS){ e.state = 'chase'; e.lostFor = 0; }
      }
      if(e.state === 'chase'){
        let tx = px, tz = pz;
        if(!los){ const c = peekTarget(ex, ez, px, pz, obstacles); tx = c.x; tz = c.z; }   // se repositionne autour du couvert
        moveToward(e, tx, tz, ENEMY_RUN*spec.speedMult, dt); desired = 'run';
      } else if(e.state === 'shoot'){ faceToward(e, px, pz, dt); enemyTryShoot(e, dt); desired = 'idle'; }   // tire debout (pas d'anim mêlée)
      else { if(!e.target || Math.hypot(e.target.x - ex, e.target.z - ez) < 0.6) pickPatrol(e);
        moveToward(e, e.target.x, e.target.z, ENEMY_WALK*spec.speedMult, dt); desired = 'walk'; }
    }
    clampEnemy(e);
    setEnemyLoco(e, desired);
    e.hitbox.position.set(e.root.position.x, e.root.position.y + (e.hbY || 0.9), e.root.position.z);
    e.hitbox.updateMatrixWorld();
    if(e.flashUntil && nowS() >= e.flashUntil){ setEnemyEmissive(e, false); e.flashUntil = 0; }
    if(e.muzzleFlashUntil && nowS() >= e.muzzleFlashUntil){ if(e.muzzleFlash) e.muzzleFlash.visible = false; e.muzzleFlashUntil = 0; }
    e.mixer.update(dt);
  }
}

function faceDir(e, vx, vz, dt){
  const target = Math.atan2(vx, vz);
  let a = e.root.rotation.y;
  let diff = ((target - a + Math.PI) % (Math.PI*2)) - Math.PI;
  e.root.rotation.y = a + diff*Math.min(1, dt*ENEMY_TURN);
}
function moveToward(e, tx, tz, spd, dt){
  const dx = tx - e.root.position.x, dz = tz - e.root.position.z;
  const len = Math.hypot(dx, dz) || 1;
  e.root.position.x += (dx/len)*spd*dt;
  e.root.position.z += (dz/len)*spd*dt;
  faceDir(e, dx/len, dz/len, dt);
}
function pickPatrol(e){
  e.target = { x:(Math.random()*2-1)*MAP_HALF*0.9, z:(Math.random()*2-1)*MAP_HALF*0.9 };
}
function faceToward(e, tx, tz, dt){
  const dx = tx - e.root.position.x, dz = tz - e.root.position.z;
  const len = Math.hypot(dx, dz) || 1;
  faceDir(e, dx/len, dz/len, dt);
}
function clampEnemy(e){
  e.root.position.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, e.root.position.x));
  e.root.position.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, e.root.position.z));
  for(const b of obstacles){
    const o = pushOutCircleAABB(e.root.position.x, e.root.position.z, ENEMY_R, b);

function setEnemyLoco(e, state){

  const prev = e.actions[e.loco];
  if(next){ next.reset().play(); if(prev && prev!==next) prev.crossFadeTo(next, 0.2, false); }
  e.loco = state;
}

// ====== Combo / killstreak (#29) : enchaîner des kills monte un multiplicateur argent/score ======
const COMBO_WINDOW = 3.5;
let comboCount = 0, comboExpireAt = 0;
function comboMultiplier(n){ return Math.min(5, 1 + Math.floor(n/3)); }
function comboTimeFrac(){ return comboCount > 0 ? Math.max(0, (comboExpireAt - nowS()) / COMBO_WINDOW) : 0; }
function registerKill(){
  comboCount++; comboExpireAt = nowS() + COMBO_WINDOW;
  if(comboCount > (save.bestCombo || 0)){ save.bestCombo = comboCount; persist(); }
  return comboMultiplier(comboCount);
}
function breakCombo(){ if(comboCount){ comboCount = 0; updateComboHud(); } }
function resetCombo(){ comboCount = 0; comboExpireAt = 0; updateComboHud(); }
function updateCombo(){ if(comboCount > 0 && nowS() >= comboExpireAt) breakCombo(); }

  el.classList.remove('hidden');
  if(pulse){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');

  if(e.hitbox && e.hitbox.parent) e.hitbox.parent.remove(e.hitbox);  // hitbox off (corps non ciblable / traversable)

  const body   = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.10,0.40), steel); body.position.set(0,0,0.02);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.020,0.020,0.34,10), steel); barrel.rotation.x = Math.PI/2; barrel.position.set(0,0.012,0.30);
  const stock  = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.08,0.15), dark); stock.position.set(0,-0.01,-0.22);
  const grip   = new THREE.Mesh(new THREE.BoxGeometry(0.045,0.13,0.06), dark); grip.position.set(0,-0.10,-0.03); grip.rotation.x = 0.30;
  const mag    = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.14,0.05), dark); mag.position.set(0,-0.12,0.07); mag.rotation.x = -0.12;
  g.add(body,barrel,stock,grip,mag);
  g.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  return g;   // +Z = canon vers l'avant, longueur ~0.5
}
function buildSmgMesh(){   // mitraillette compacte (~0.4)

function buildSniperMesh(){   // fusil de précision long (~0.7)

  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.5,10), steel); barrel.rotation.x = Math.PI/2; barrel.position.set(0,0.01,0.42);
  const scope  = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.14,10), dark); scope.rotation.x = Math.PI/2; scope.position.set(0,0.08,0.04);
  const stock  = new THREE.Mesh(new THREE.BoxGeometry(0.045,0.08,0.18), dark); stock.position.set(0,-0.01,-0.26);

  g.add(body,barrel,scope,stock,grip);
