<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeu — Tranche 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b0d12;color:#e8ecf4;font-family:"Segoe UI",system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #lobby{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:32px 0 40px;pointer-events:none}
  #lobby.hidden{display:none}
  .lobby-title{font-size:24px;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .home-top{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .home-title{font-size:40px;font-weight:800;letter-spacing:3px;
    background:linear-gradient(135deg,#7ea2ff,#b56bff);-webkit-background-clip:text;background-clip:text;
    color:transparent;text-shadow:0 6px 30px rgba(91,140,255,.25)}
  .home-sub{font-size:14px;opacity:.7}
  .home-meta{display:flex;gap:10px;margin-top:6px}
  .chip{background:rgba(20,24,33,.7);border:1px solid rgba(120,150,220,.25);border-radius:999px;
    padding:5px 13px;font-size:14px;font-weight:700}
  #home-money{color:#ffd479}
  .home-buttons{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .home-btn2{padding:13px 22px;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;
    color:#e8ecf4;background:rgba(20,24,33,.7);border:1px solid rgba(120,150,220,.3);transition:.15s}
  .home-btn2:hover{background:rgba(91,140,255,.18);border-color:#5b8cff;transform:translateY(-2px)}
  .lobby-bottom{display:flex;flex-direction:column;align-items:center;gap:16px}
  .select-bar{display:flex;align-items:center;gap:18px;pointer-events:auto;
    background:rgba(20,24,33,.7);backdrop-filter:blur(10px);border:1px solid rgba(120,150,220,.18);
    border-radius:16px;padding:10px 16px}
  .select-bar .nav{width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1;
    background:rgba(255,255,255,.06);color:#e8ecf4;border:1px solid rgba(120,150,220,.25);cursor:pointer;transition:.15s}
  .select-bar .nav:hover{background:#5b8cff;color:#0b0d12;border-color:#5b8cff}
  .char-name{font-size:20px;font-weight:700;min-width:200px;text-align:center}
  #play-btn{pointer-events:auto;padding:14px 48px;font-size:17px;font-weight:700;border-radius:12px;
    border:1px solid #5b8cff;background:linear-gradient(135deg,#5b8cff,#b56bff);color:#0b0d12;cursor:pointer;
    box-shadow:0 10px 30px rgba(91,140,255,.35);transition:.15s}
  #play-btn:hover{transform:translateY(-2px)}
  #hud{position:fixed;left:16px;bottom:16px;z-index:10;background:rgba(20,24,33,.8);
    border:1px solid rgba(120,150,220,.18);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.5}
  #hud.hidden,#pause.hidden,#overlay.hidden{display:none}
  #pause,#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,15,.8);backdrop-filter:blur(6px);text-align:center;padding:24px}
  #overlay-msg{max-width:520px;line-height:1.6}
  #overlay code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px;color:#ffd479}
  #crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:18px;height:18px;pointer-events:none}
  #crosshair.hidden{display:none}
  #sight{position:fixed;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);z-index:12;
    border:1.5px solid rgba(120,235,150,.55);border-radius:50%;display:none;pointer-events:none}
  #sight::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
    transform:translate(-50%,-50%);background:#7dff9e;box-shadow:0 0 6px 1px rgba(120,255,150,.9)}
  #sight::after{content:"";position:absolute;left:50%;top:-9px;width:1.5px;height:7px;transform:translateX(-50%);
    background:rgba(120,235,150,.7);box-shadow:0 49px 0 rgba(120,235,150,.7)}
  #sight.show{display:block}
  #scope{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;transition:opacity .12s;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 30%, rgba(0,0,0,.45) 62%, rgba(0,0,0,.85) 100%)}
  #scope.show{opacity:1}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:#e8f0ff;box-shadow:0 0 3px rgba(0,0,0,.85)}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  #crosshair.aim{width:9px;height:9px}
  #hitmarker{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;color:#ff5b5b;
    font-size:26px;font-weight:900;opacity:0;transition:opacity .08s;pointer-events:none}
  #hitmarker.show{opacity:1}
  #combat{position:fixed;right:16px;bottom:16px;z-index:10;background:rgba(20,24,33,.8);
    border:1px solid rgba(120,150,220,.18);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;text-align:right}
  #combat.hidden{display:none}
  #wave-hud{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:10;
    background:rgba(20,24,33,.8);border:1px solid rgba(120,150,220,.18);border-radius:12px;
    padding:7px 16px;font-size:14px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  #wave-hud.hidden{display:none}
  #wave-hud b{color:#b8c8ff}
  #money-hud{position:fixed;left:16px;top:14px;z-index:10;background:rgba(20,24,33,.8);
    border:1px solid rgba(120,150,220,.18);border-radius:12px;padding:7px 14px;
    font-size:15px;font-weight:700;color:#ffd479;white-space:nowrap}
  #money-hud.hidden{display:none}
  #radar{position:fixed;right:16px;top:14px;z-index:10;width:150px;height:150px;border-radius:50%;
    background:rgba(12,16,24,.62);border:1px solid rgba(120,150,220,.3);box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #radar.hidden{display:none}
  #wave-banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.82);z-index:21;
    font-size:42px;font-weight:800;color:#e8ecf4;text-shadow:0 4px 24px rgba(0,0,0,.75);
    opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;
    text-align:center;white-space:nowrap}
  #wave-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #vignette{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .12s;
    box-shadow:inset 0 0 140px 40px rgba(200,20,20,.85)}
  #vignette.show{opacity:1}
  #healthbar{position:fixed;left:16px;bottom:124px;width:240px;height:16px;z-index:10;
    background:rgba(20,24,33,.8);border:1px solid rgba(120,150,220,.25);border-radius:9px;overflow:hidden}
  #healthbar.hidden{display:none}
  #health-fill{height:100%;width:100%;background:linear-gradient(90deg,#3ad17a,#8fe07a);transition:width .15s}
  #gameover{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,15,.88);backdrop-filter:blur(8px);text-align:center}
  #gameover.hidden{display:none}
  .go-inner h1{font-size:40px;margin-bottom:14px}
  #go-score{font-size:18px;margin-bottom:20px;opacity:.9}
  #go-restart{padding:12px 22px;border-radius:11px;border:1px solid #5b8cff;font-size:16px;cursor:pointer;
    background:linear-gradient(135deg,rgba(91,140,255,.3),rgba(181,107,255,.25));color:#e8ecf4}
  #go-menu{margin-left:10px;padding:12px 22px;border-radius:11px;border:1px solid rgba(120,150,220,.4);
    font-size:16px;cursor:pointer;background:rgba(20,24,33,.7);color:#e8ecf4}
  .panel{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,15,.82);backdrop-filter:blur(8px)}
  .panel.hidden{display:none}
  .panel-card{background:rgba(20,24,33,.92);border:1px solid rgba(120,150,220,.25);border-radius:18px;
    padding:30px 40px;text-align:center;max-width:440px}
  .panel-card h2{font-size:26px;margin-bottom:12px}
  .panel-card p{opacity:.8;line-height:1.6;margin-bottom:20px}
  .panel-back{padding:11px 20px;border-radius:11px;border:1px solid #5b8cff;font-size:15px;cursor:pointer;
    background:linear-gradient(135deg,rgba(91,140,255,.3),rgba(181,107,255,.25));color:#e8ecf4}
  .settings-card{max-width:420px;text-align:left}
  .set-row{display:flex;align-items:center;gap:14px;margin:14px 0}
  .set-row label{flex:1;font-size:15px;opacity:.92}
  .set-row input[type=range]{flex:0 0 150px;accent-color:#6f9bff;cursor:pointer}
  .set-val{flex:0 0 46px;text-align:right;font-weight:700;color:#b8c8ff}
  .set-toggle{flex:0 0 150px;padding:9px 0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
    color:#e8ecf4;background:rgba(34,40,58,.8);border:1px solid rgba(120,150,220,.35);transition:.15s}
  .set-toggle:hover{border-color:#6f9bff;background:rgba(91,140,255,.18)}
  .settings-card .panel-back{margin-top:10px}
  /* ====== Boutique v2 : carrousel 3D + UI bas-centre ====== */
  #shop-panel{position:fixed;inset:0;z-index:45;
    background:radial-gradient(ellipse 95% 88% at 50% 42%, transparent 46%, rgba(18,22,34,.34) 100%)}
  #shop-panel.hidden{display:none}
  .shop-header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:16px 22px;z-index:3}
  .shop-tabs{display:flex;gap:8px}
  .shop-tab{padding:10px 20px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;
    color:#cdd6e6;background:rgba(34,40,58,.7);border:1px solid rgba(150,175,235,.25);transition:.15s}
  .shop-tab:hover{color:#fff}
  .shop-tab.active{color:#0b0d12;background:linear-gradient(135deg,#6f9bff,#c07bff);border-color:#6f9bff}
  .shop-money2{margin-left:auto;font-size:18px;font-weight:800;color:#ffd479;
    background:rgba(34,40,58,.7);border:1px solid rgba(150,175,235,.28);border-radius:999px;padding:7px 16px}
  .shop-close{width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer;
    color:#e8ecf4;background:rgba(34,40,58,.7);border:1px solid rgba(150,175,235,.28);transition:.15s}
  .shop-close:hover{background:#ff5b5b;color:#0b0d12;border-color:#ff5b5b}
  .shop-nav-arrow{position:absolute;top:40%;transform:translateY(-50%);z-index:3;
    width:58px;height:58px;border-radius:50%;font-size:32px;line-height:1;cursor:pointer;
    color:#e8ecf4;background:rgba(34,40,58,.62);border:1px solid rgba(150,175,235,.32);transition:.15s}
  .shop-nav-arrow.left{left:6%}
  .shop-nav-arrow.right{right:6%}
  .shop-nav-arrow:hover{background:#6f9bff;color:#0b0d12;border-color:#6f9bff}
  .shop-info{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    gap:12px;padding:16px 22px 24px;text-align:center;
    background:linear-gradient(0deg, rgba(12,15,23,.94), rgba(12,15,23,.55) 72%, transparent)}
  .shop-wname{font-size:26px;font-weight:800;letter-spacing:.5px}
  .shop-rating{font-size:15px;color:#ffd479;margin-left:6px;vertical-align:middle}
  .shop-statcards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .shop-statcard{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;
    background:rgba(34,40,58,.72);border:1px solid rgba(150,175,235,.2);border-radius:12px;padding:8px 14px}
  .shop-statcard>span{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.65}
  .shop-statcard>b{font-size:22px;font-weight:800;color:#dbe6ff}
  .shop-btns{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .shop-cta{padding:13px 30px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;
    color:#e8ecf4;background:rgba(34,40,58,.8);border:1px solid rgba(150,175,235,.4);transition:.15s}
  .shop-cta.buy{border-color:#6f9bff;background:linear-gradient(135deg,#6f9bff,#c07bff);color:#0b0d12}
  .shop-cta.ameliorer{border-color:#ff5b6e;background:linear-gradient(135deg,#ff5b6e,#ff8a4b);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .shop-cta.ameliorer.open{filter:brightness(1.12)}
  .shop-cta:not(:disabled):hover{transform:translateY(-2px)}
  .shop-cta:disabled{opacity:.45;cursor:default}
  .shop-badge{padding:13px 26px;border-radius:12px;font-size:16px;font-weight:800;color:#8fe07a;border:1px solid #3ad17a}
  .shop-upgrades{display:flex;flex-direction:column;gap:7px;width:min(420px,86vw);margin-top:2px;
    background:rgba(22,27,40,.78);border:1px solid rgba(150,175,235,.2);border-radius:14px;padding:13px 18px}
  .shop-statrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
  .shop-statrow>span{opacity:.9}
  .shop-statrow>span i{opacity:.55;font-style:normal;font-size:12px;margin-left:4px}
  .shop-upg-btn{padding:6px 13px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
    color:#e8ecf4;background:rgba(34,40,58,.8);border:1px solid rgba(150,175,235,.3);transition:.15s}
  .shop-upg-btn.buy{border-color:#6f9bff;background:linear-gradient(135deg,rgba(111,155,255,.4),rgba(192,123,255,.3))}
  .shop-upg-btn:not(:disabled):hover{transform:translateY(-1px)}
  .shop-upg-btn:disabled{opacity:.4;cursor:default}
  /* onglet Personnage : bloc à gauche + tableau des persos */
  .shop-info.left{left:4%;right:auto;bottom:auto;top:50%;transform:translateY(-50%);align-items:flex-start;text-align:left;
    width:340px;max-height:84vh;overflow-y:auto;padding:18px 20px;border-radius:18px;
    background:rgba(16,20,30,.9);border:1px solid rgba(150,175,235,.22);backdrop-filter:blur(8px)}
  .shop-info.left .shop-wname{font-size:22px;margin-bottom:12px}
  .shop-chartable{display:flex;flex-direction:column;gap:4px;width:100%;margin-bottom:8px}
  .shop-chartr{display:grid;grid-template-columns:1fr 34px 42px 46px 66px;align-items:center;gap:6px;
    font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
  .shop-chartr.on{background:rgba(111,155,255,.20);border:1px solid rgba(111,155,255,.45)}
  .shop-charhead{background:transparent;opacity:.6;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .shop-chartr>span:not(:first-child){text-align:center}
  .shop-chartr>span:last-child{text-align:right}
  .shop-chartag{color:#8fe07a;font-weight:800}
  .shop-charbtn{padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
    color:#e8ecf4;background:rgba(34,40,58,.85);border:1px solid rgba(150,175,235,.35);transition:.15s}
  .shop-charbtn.buy{border-color:#ffd479;color:#ffd479}
  .shop-charbtn:not(:disabled):hover{transform:translateY(-1px)}
  .shop-charbtn:disabled{opacity:.4;cursor:default}
  .shop-sub2{font-size:12px;font-weight:700;opacity:.8;width:100%;margin:8px 0 8px;
    border-top:1px solid rgba(150,175,235,.18);padding-top:10px}
  .shop-upgrades.nobox{background:transparent;border:none;padding:0;width:100%;margin-top:0}
  .shop-swatch{display:inline-block;width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.35);vertical-align:middle}
</style>
</head>
<body>
<div id="app"></div>

<div id="lobby">
  <div class="home-top">
    <div class="home-title">OPÉRATION SURVIE</div>
    <div class="home-sub">Survis aux vagues. Gagne de quoi t'équiper.</div>
    <div class="home-meta">
      <span id="home-money" class="chip">💰 0</span>
      <span id="home-record" class="chip">🏆 Vague 0</span>
    </div>
  </div>
  <div class="lobby-bottom">
    <div class="select-bar">
      <button id="prev" class="nav" title="Précédent">‹</button>
      <div id="char-name" class="char-name">—</div>
      <button id="next" class="nav" title="Suivant">›</button>
    </div>
    <div class="home-buttons">
      <button id="play-btn">Jouer ▶</button>
      <button id="btn-shop" class="home-btn2">🛒 Boutique</button>
      <button id="btn-settings" class="home-btn2">⚙️ Réglages</button>
    </div>
  </div>
</div>

<div id="hud" class="hidden"></div>
<div id="pause" class="hidden"><div>⏸ En pause — clique pour reprendre</div></div>
<div id="overlay" class="hidden"><div id="overlay-msg"></div></div>
<div id="crosshair" class="hidden"></div>
<div id="scope"></div>
<div id="sight"></div>
<div id="hitmarker">✕</div>
<div id="combat" class="hidden"></div>
<div id="wave-hud" class="hidden"></div>
<div id="money-hud" class="hidden"></div>
<canvas id="radar" width="150" height="150" class="hidden"></canvas>
<div id="wave-banner"></div>
<div id="vignette"></div>
<div id="healthbar" class="hidden"><div id="health-fill"></div></div>
<div id="gameover" class="hidden"><div class="go-inner">
  <h1>💀 Game Over</h1><div id="go-score"></div>
  <button id="go-restart">Rejouer ▶</button>
  <button id="go-menu">Menu ◀</button>
</div></div>
<div id="shop-panel" class="hidden">
  <div class="shop-header">
    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="weapons">🔫 Armes</button>
      <button class="shop-tab" data-tab="player">🧍 Personnage</button>
      <button class="shop-tab" data-tab="skins">🎨 Skins</button>
    </div>
    <div class="shop-money2">💰 <span id="shop-money-val">0</span></div>
    <button id="shop-close" class="shop-close" title="Fermer">✕</button>
  </div>
  <button id="shop-prev" class="shop-nav-arrow left" title="Précédent">‹</button>
  <button id="shop-next" class="shop-nav-arrow right" title="Suivant">›</button>
  <div id="shop-info" class="shop-info"></div>
</div>
<div id="settings-panel" class="panel hidden"><div class="panel-card settings-card">
  <h2>⚙️ Réglages</h2>
  <div class="set-row"><label for="set-sensitivity">🖱️ Sensibilité souris</label>
    <input id="set-sensitivity" type="range" min="0.2" max="3" step="0.1" />
    <span id="set-sensitivity-val" class="set-val"></span></div>
  <div class="set-row"><label for="set-volume">🔊 Volume</label>
    <input id="set-volume" type="range" min="0" max="1" step="0.05" />
    <span id="set-volume-val" class="set-val"></span></div>
  <div class="set-row"><label for="set-view">🎥 Vue par défaut</label>
    <button id="set-view" class="set-toggle"></button></div>
  <button class="panel-back" data-panel="settings-panel">◀ Retour</button>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

// ====== API debug (contrat figé) ======
const G = window.__game = {
  booted:false, phase:'lobby', characters:[], character:null,
  locomotion:'idle', clips:[], view:'third',
  position(){ return model ? worldPos(model) : {x:0,y:0,z:0}; },
  camera(){ return {x:camera.position.x,y:camera.position.y,z:camera.position.z, yaw:camYaw, pitch:camPitch, dist:camDist}; },
  debug:{},
};
function worldPos(o){ const v=new THREE.Vector3(); o.getWorldPosition(v); return {x:v.x,y:v.y,z:v.z}; }

// ====== Helpers purs (sans three.js) ======
function cameraRelative(input, yaw){
  const f = input.forward||0, s = input.strafe||0;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  // avant = (sin,cos) ; droite = (cos,-sin)
  return { x: sin*f + cos*s, z: cos*f - sin*s };
}
const WALK_EPS = 0.05;
function locomotionState(speed, sprint){
  if (speed < WALK_EPS) return 'idle';
  return sprint ? 'run' : 'walk';
}
const ROLE_RE = { idle:/alert|idle|wait/i, walk:/walk|march/i, run:/run|sprint|course/i, attack:/attack|combat|punch|hit|skill/i, dead:/dead|death|die|mort/i };
function resolveClipRole(role, names){
  const re = ROLE_RE[role]; if (!re) return null;
  return names.find(n => re.test(n)) || null;
}
function pushOutCircleAABB(px, pz, r, box){
  const cx = Math.max(box.minX, Math.min(px, box.maxX));
  const cz = Math.max(box.minZ, Math.min(pz, box.maxZ));
  const dx = px - cx, dz = pz - cz;
  const d2 = dx*dx + dz*dz;
  if (d2 >= r*r) return { x:px, z:pz };           // pas de pénétration
  if (d2 > 1e-12){                                 // dehors en distance, on pousse le long de la normale
    const d = Math.sqrt(d2); const nx = dx/d, nz = dz/d;
    return { x: cx + nx*r, z: cz + nz*r };
  }
  // centre dans la boîte : pousser sur l'axe de moindre pénétration
  const pen = [
    { v: px - box.minX + r, x: box.minX - r, z: pz }, // vers -X
    { v: box.maxX - px + r, x: box.maxX + r, z: pz }, // vers +X
    { v: pz - box.minZ + r, x: px, z: box.minZ - r }, // vers -Z
    { v: box.maxZ - pz + r, x: px, z: box.maxZ + r }, // vers +Z
  ].sort((a,b)=>a.v-b.v)[0];
  return { x: pen.x, z: pen.z };
}

async function seedPersosToGallery() {
  let dirs;
  try { dirs = (await listDir(PERSO_DIR)).filter(h => h.endsWith('/')); } catch (e) { return; }
  for (const d of dirs) {
    const pid = decodeURIComponent(d.replace(/\/$/, ''));

let anims = [];           // [{ key, label, icon, clip }]
let sourceModel=null, sourceBoneByName={}, sourceRest=null, sourceRestWorld=null;
let targetRest=null, targetRestWorld=null, targetBoneOrder=null;

function captureRest(root) {
  const map = {};
  root.traverse(o => { if (o.isBone) map[o.name] = { q: o.quaternion.clone(), p: o.position.clone() }; });
  return map;
}
function captureRestWorld(root) {
  root.updateMatrixWorld(true);
  const map = {}; const q = new THREE.Quaternion();
  root.traverse(o => { if (o.isBone) { o.getWorldQuaternion(q); map[o.name] = q.clone(); } });
  return map;
}
function boneOrder(root) {
  const list = [];
  root.traverse(o => { if (o.isBone) list.push({ name: o.name, parent: (o.parent && o.parent.isBone) ? o.parent.name : null }); });
  return list;
}

// Retargeting espace-monde : applique un clip du rig source à n'importe quel rig cible
function retargetClipWorld(raw) {
  const dur = raw.duration;
  const n = Math.max(2, Math.round(dur * 30) + 1);
  const srcMixer = new THREE.AnimationMixer(sourceModel);
  srcMixer.clipAction(raw).play();

  const samples = {}; for (const b of targetBoneOrder) samples[b.name] = [];
  const times = [];
  const qWsrc = new THREE.Quaternion(), tmp = new THREE.Quaternion();
  const tgtWorld = {};

  for (let f = 0; f < n; f++) {
    const t = (f / (n - 1)) * dur;
    times.push(t);
    srcMixer.setTime(t);
    sourceModel.updateMatrixWorld(true);
    for (const b of targetBoneOrder) {
      const sBone = sourceBoneByName[b.name];
      const sRW = sourceRestWorld[b.name], tRW = targetRestWorld[b.name];
      if (!sBone || !sRW || !tRW) { samples[b.name].push(null); continue; }
      sBone.getWorldQuaternion(qWsrc);
      tmp.copy(qWsrc).multiply(sRW.clone().invert()).multiply(tRW);     // qWsrc · sRW⁻¹ · tRW
      tgtWorld[b.name] = tmp.clone();
      const localQ = b.parent && tgtWorld[b.parent]
        ? tgtWorld[b.parent].clone().invert().multiply(tmp)
        : tmp.clone();
      samples[b.name].push(localQ);
    }
  }
  srcMixer.stopAllAction();

  const tracks = [];
  const timesArr = Float32Array.from(times);
  for (const name in samples) {
    const arr = samples[name];
    if (!arr.length || arr.some(q => !q)) continue;
    const vals = new Float32Array(arr.length * 4);
    for (let i = 0; i < arr.length; i++) { const q = arr[i]; vals[i*4]=q.x; vals[i*4+1]=q.y; vals[i*4+2]=q.z; vals[i*4+3]=q.w; }
    tracks.push(new THREE.QuaternionKeyframeTrack(name + '.quaternion', timesArr, vals));
  }
  // bassin : seulement le rebond vertical, recentré X/Z (anim sur place)
  const hp = raw.tracks.find(tt => tt.name === ROOT_BONE + '.position');
  const sP = sourceRest[ROOT_BONE]?.p, tP = targetRest[ROOT_BONE]?.p;
  if (hp && sP && tP) {
    const ratio = sP.y ? tP.y / sP.y : 1;
    const vals = Float32Array.from(hp.values);
    for (let i = 0; i < vals.length; i += 3) { vals[i] = tP.x; vals[i+1] = tP.y + (vals[i+1] - sP.y) * ratio; vals[i+2] = tP.z; }
    tracks.push(new THREE.VectorKeyframeTrack(ROOT_BONE + '.position', Array.from(hp.times), vals));
  }
  return new THREE.AnimationClip(raw.name, raw.duration, tracks);
}

async function loadAnims(animFiles) {
  anims = [];
  for (const f of animFiles) {
    try {
      const g = await loader.loadAsync(ANIM_DIR + f);
      const clip = g.animations[0];
      if (!clip) continue;
      const key = animKeyFromFile(f);
      clip.name = key;
      anims.push({ key, label: prettyLabel(key), icon: iconFor(f), clip });
      // 1er fichier = squelette source partagé (les clips sont créés sur ce rig)
      if (!sourceModel) {
        sourceModel = g.scene;
        sourceRest = captureRest(g.scene);
        sourceRestWorld = captureRestWorld(g.scene);
        g.scene.traverse(o => { if (o.isBone) sourceBoneByName[o.name] = o; });
      }
    } catch (e) { console.warn('anim KO', f, e); }
  }
  anims.sort((a, b) => a.label.localeCompare(b.label));
}

// idle dérivé : rapproche chaque pose de la pose de repos cible (repli si pas d'Alert)
function deriveIdle(clip){
  const amp = 0.18;
  const tracks = clip.tracks.map(tr=>{
    if(!tr.name.endsWith('.quaternion')) return tr.clone();
    const boneName = tr.name.slice(0, tr.name.lastIndexOf('.'));
    const rest = targetRest[boneName] && targetRest[boneName].q;
    if(!rest) return tr.clone();
    const v = Float32Array.from(tr.values);
    const q = new THREE.Quaternion(), o = new THREE.Quaternion();
    for(let i=0;i<v.length;i+=4){
      q.set(v[i],v[i+1],v[i+2],v[i+3]);
      o.copy(rest).slerp(q, amp);
      v[i]=o.x; v[i+1]=o.y; v[i+2]=o.z; v[i+3]=o.w;
    }
    return new THREE.QuaternionKeyframeTrack(tr.name, Float32Array.from(tr.times), v);
  });
  return new THREE.AnimationClip('idle_derived', clip.duration, tracks);
}

async function spawnModel(char){
  const url = URL.createObjectURL(new Blob([char.bytes]));
  const gltf = await loader.loadAsync(url); URL.revokeObjectURL(url);
  const m = gltf.scene;
  m.traverse(o => { if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });

  targetRest = captureRest(m); targetRestWorld = captureRestWorld(m); targetBoneOrder = boneOrder(m);
  const box = new THREE.Box3().setFromObject(m);
  const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
  const s = 1.8/(size.y||1); m.scale.setScalar(s);
  m.position.sub(center.multiplyScalar(s)); m.position.y += (size.y*s)/2;

async function playLobbyIdle(){
  if(!model || window.__FAST_WEAPON__) return;
  const target = model;
  try { if(!anims.length) await loadAnims((await listDir(ANIM_DIR)).filter(isGlb)); } catch(e){ return; }
  if(model !== target) return;                          // un autre perso a été sélectionné entre-temps
  // lobby = perso sans arme → pose debout détendue (bras le long du corps) : 1er frame de "Agree_Gesture" figé.
  // (l'idle EN JEU reste "Alert" — correct car le perso tient alors son arme.)
  const calm = anims.find(a => a.key === 'Agree_Gesture');
  const clip = calm ? retargetClipWorld(calm.clip) : retargetRole('idle');
  if(clip){ mixer = new THREE.AnimationMixer(model); const act = mixer.clipAction(clip);
    if(calm){ act.play(); act.paused = true; act.time = 0.05; mixer.update(0); }   // pose figée naturelle
    else act.play();

}

function retargetRole(role){
  const names = anims.map(a => a.key);
  const key = resolveClipRole(role, names);
  let raw = key ? anims.find(a=>a.key===key)?.clip : null;
  if(!raw && role==='run') raw = anims.find(a=>resolveClipRole('walk',[a.key]))?.clip; // run -> walk
  if(!raw && role==='walk') raw = anims.find(a=>resolveClipRole('run',[a.key]))?.clip;  // walk -> run
  if(!raw && role==='idle'){ const w = anims.find(a=>resolveClipRole('walk',[a.key]))?.clip; return w?deriveIdle(retargetClipWorld(w)):null; }
  if(!raw) return null;
  return retargetClipWorld(raw);
}

const PITCH_3RD_MIN = -0.2, PITCH_3RD_MAX = 0.9;   // orbite 3e personne (regard surtout vers le bas)
const PITCH_1ST_MIN = -1.35, PITCH_1ST_MAX = 1.35; // 1re personne : haut ET bas (quasi vertical)
function clampPitch(){
  const lo = view === 'first' ? PITCH_1ST_MIN : PITCH_3RD_MIN;
  const hi = view === 'first' ? PITCH_1ST_MAX : PITCH_3RD_MAX;
  camPitch = Math.max(lo, Math.min(hi, camPitch));
}
function applyLook(dx, dy){
  camYaw -= dx * 0.0025 * lookSensitivity;
  // 1re personne : souris vers le haut (dy<0) => regarder vers le haut (pitch ↑) — non inversé.
  // 3e personne : on conserve l'orbite existante.
  camPitch += (view === 'first' ? -dy : dy) * 0.0025 * lookSensitivity;
  clampPitch();
}

const AIM_DIST = 3.0, SHOULDER = 0.6;
let shake = 0;
function updateCamera(dt){
  if(!model) return;
  if(view === 'first'){
    const p = model.position;
    const eye = p.y + EYE_HEIGHT;
    camDist += (0 - camDist) * Math.min(1, dt*10);
    camera.position.set(p.x, eye, p.z);
    if(shake > 0){ const k = shake*0.06; camera.position.x += (Math.random()-0.5)*k; camera.position.y += (Math.random()-0.5)*k; shake = Math.max(0, shake - dt*6); }
    const look = new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
    camera.lookAt(camera.position.x + look.x, camera.position.y + look.y, camera.position.z + look.z);
    return;
  }
  const targetDist = input.aim ? AIM_DIST : CAM_DIST;
  camDist += (targetDist - camDist) * Math.min(1, dt*10);
  const p = model.position;
  const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
  const sh = input.aim ? SHOULDER : 0;
  const ty = p.y + 1.5;
  const look = new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
  const desired = new THREE.Vector3(
    p.x - look.x*camDist + right.x*sh,
    ty + look.y*camDist,
    p.z - look.z*camDist + right.z*sh);
  camera.position.lerp(desired, Math.min(1, dt*8));
  if(shake > 0){ const k = shake*0.12; camera.position.x += (Math.random()-0.5)*k; camera.position.y += (Math.random()-0.5)*k; shake = Math.max(0, shake - dt*6); }
  camera.lookAt(p.x + right.x*sh, ty, p.z + right.z*sh);
}

// ====== Contrôleur + machine d'état locomotion ======
const WALK_SPEED = 2.4, RUN_SPEED = 5.4, TURN_LERP = 12;
let curLoco = 'idle';
function setLoco(state){
  if(state===curLoco) return;
  const next = actions[state] || actions.idle;
  const prev = actions[curLoco];
  if(next){ next.reset().play(); if(prev && prev!==next) prev.crossFadeTo(next, 0.2, false); }
  curLoco = state; G.locomotion = state;
}
function updateController(dt){
  if(G.phase!=='playing' || !model) return;
  const f = (input.forward?1:0) - (input.back?1:0);
  const s = (input.left?1:0) - (input.right?1:0); // +s = droite écran (corrige l'inversion gauche/droite)
  let speed = 0;
  if(f||s){
    const dir = cameraRelative({forward:f, strafe:s}, camYaw);
    const len = Math.hypot(dir.x, dir.z) || 1;
    const vx = dir.x/len, vz = dir.z/len;
    speed = (input.sprint ? RUN_SPEED : WALK_SPEED) * speedMult;
    model.position.x += vx*speed*dt;
    model.position.z += vz*speed*dt;
    const target = Math.atan2(vx, vz);
    let a = model.rotation.y;
    let diff = ((target - a + Math.PI)%(Math.PI*2)) - Math.PI;
    model.rotation.y = a + diff*Math.min(1, dt*TURN_LERP);
  }
  // bornes de map
  model.position.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, model.position.x));
  model.position.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, model.position.z));
  // collision obstacles
  for(const b of obstacles){
    const o = pushOutCircleAABB(model.position.x, model.position.z, PLAYER_R, b);
    model.position.x = o.x; model.position.z = o.z;
  }
  // saut (vertical, gravité)
  if(!grounded){
    velY -= GRAVITY*dt;
    model.position.y += velY*dt;
    if(model.position.y <= groundY){ model.position.y = groundY; velY = 0; grounded = true; }
  }
  setLoco(locomotionState(speed, input.sprint));
}

let shopOpen = false, shopTab = 'weapons', shopWeaponIndex = 0;
let shopWeaponObj = null, shopSideL = null, shopSideR = null, shopGlbCache = null, shopAmeliorerOpen = false, shopBuildSeq = 0;
const SHOP_CENTER_POS = new THREE.Vector3(0, 1.78, 0.4);
const SHOP_SIDE_L = new THREE.Vector3(-2.6, 1.62, -1.1), SHOP_SIDE_R = new THREE.Vector3(2.6, 1.62, -1.1);
// modèle de vitrine : vrai GLB pour le fusil (sauf mode test rapide), primitive pour les autres armes
async function buildPreviewModel(id){
  const w = weaponById(id);
  if(w.glb && !window.__FAST_WEAPON__){
    if(!shopGlbCache){
      const url = await findWeaponGlb();
      if(url){ try {
        const g = await loader.loadAsync(url); g.scene.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(g.scene), s = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
        const sc = WEAPON_LEN / (Math.max(s.x, s.y, s.z) || 1);
        g.scene.scale.setScalar(sc); g.scene.position.sub(c.multiplyScalar(sc));
        if(s.x >= s.y && s.x >= s.z) g.scene.rotation.y = -Math.PI/2; else if(s.y >= s.x && s.y >= s.z) g.scene.rotation.x = Math.PI/2;
        const wr = new THREE.Group(); wr.add(g.scene); shopGlbCache = wr;
      } catch(e){} }
    }
    if(shopGlbCache) return shopGlbCache.clone();
  }
  return w.build();
}
function disposeShopObj(o){ if(o) scene.remove(o); }   // pas de dispose géo (clones GLB partagent la géométrie)
function placeShopModel(m, scale, pos){
  m.scale.multiplyScalar(scale);
  const c = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()); m.position.sub(c);   // centré
  const grp = new THREE.Group(); grp.add(m); grp.position.copy(pos); scene.add(grp); return grp;
}
async function setShopWeapon(i){
  const n = WEAPONS.length; shopWeaponIndex = ((i % n) + n) % n; shopAmeliorerOpen = false;
  const seq = ++shopBuildSeq;
  disposeShopObj(shopSideL); disposeShopObj(shopSideR);
  shopSideL = placeShopModel(WEAPONS[(shopWeaponIndex - 1 + n) % n].build(), 1.55, SHOP_SIDE_L);   // voisines : primitives déco
  shopSideR = placeShopModel(WEAPONS[(shopWeaponIndex + 1) % n].build(), 1.55, SHOP_SIDE_R);
  renderShop();                                          // stats/boutons tout de suite (le modèle central suit)
  const centerModel = await buildPreviewModel(WEAPONS[shopWeaponIndex].id);
  if(seq !== shopBuildSeq) return;                       // un changement plus récent a eu lieu
  disposeShopObj(shopWeaponObj);
  shopWeaponObj = placeShopModel(centerModel, 3.0, SHOP_CENTER_POS);
  applyShopVisibility();
}
function applyShopVisibility(){
  const weaponsView = shopOpen && shopTab === 'weapons';
  if(model) model.visible = !weaponsView;               // perso caché en vitrine d'arme (lobby = toujours 3e pers.)
  for(const o of [shopWeaponObj, shopSideL, shopSideR]) if(o) o.visible = weaponsView;
}
function updateShopScene(){   // boutique ouverte => scène CLAIRE (fond clair, sans brouillard, hémisphère boostée)
  const weaponsView = shopOpen && shopTab === 'weapons';
  ground.visible = !weaponsView; grid.visible = !shopOpen;
  for(const m of obstacleMeshes) m.visible = !shopOpen;   // caisses du décor masquées (fond propre)
  shopLight.intensity = weaponsView ? 3.0 : 0; shopFill.intensity = weaponsView ? 1.7 : 0;
  hemi.intensity = shopOpen ? 2.3 : 0.9;
  scene.background = shopOpen ? SHOP_BG : SCENE_BG;
  scene.fog = shopOpen ? null : SCENE_FOG;
  document.getElementById('lobby').classList.toggle('hidden', shopOpen);
}
function updateShopCamera(){
  if(shopOpen && shopTab === 'weapons'){ camera.position.set(0, 1.7, 5.4); camera.lookAt(0, 1.3, 0); }   // armes dans le haut, UI en bas
  else if(shopOpen && (shopTab === 'player' || shopTab === 'skins')){ camera.position.set(0.6, 1.5, 4.0); camera.lookAt(-0.7, 1.0, 0); }  // perso à droite, bloc à gauche
  else setLobbyCamera();
}
function updateShopTabs(){
  for(const t of document.querySelectorAll('.shop-tab')) t.classList.toggle('active', t.dataset.tab === shopTab);
  const show = (shopTab === 'weapons') ? '' : 'none';
  const pv = document.getElementById('shop-prev'), nx = document.getElementById('shop-next');
  if(pv) pv.style.display = show; if(nx) nx.style.display = show;
}
function openShop(){
  shopOpen = true; shopTab = 'weapons';
  const i = WEAPONS.findIndex(w => w.id === save.selectedWeapon); setShopWeapon(i >= 0 ? i : 0);
  document.getElementById('shop-panel').classList.remove('hidden');
  updateShopTabs(); applyShopVisibility(); updateShopScene(); updateShopCamera(); renderShop();
}
function closeShop(){
  shopOpen = false; document.getElementById('shop-panel').classList.add('hidden');
  for(const o of [shopWeaponObj, shopSideL, shopSideR]) if(o) o.visible = false;
  if(model) model.visible = true;
  rebuildLobbyCharacters();                                   // un achat de perso a pu changer la liste
  const idx = characters.findIndex(c => c.id === save.selectedCharacterId); lobbyIndex = idx >= 0 ? idx : 0;
  const cn = document.getElementById('char-name'); if(cn && characters[lobbyIndex]) cn.textContent = characters[lobbyIndex].label;
  updateShopScene(); updateHomeMeta(); updateShopCamera();   // restaure home (méta à jour) + caméra lobby
}
function setShopTab(name){
  shopTab = (name === 'player') ? 'player' : (name === 'skins') ? 'skins' : 'weapons';
  updateShopTabs(); applyShopVisibility(); updateShopScene(); updateShopCamera(); renderShop();
}
Object.assign(G.debug.shop, {
  open(){ openShop(); }, close(){ closeShop(); }, isOpen(){ return shopOpen; },
  tab(name){ setShopTab(name); }, currentTab(){ return shopTab; },
  setWeapon(x){ const i = (typeof x === 'number') ? x : WEAPONS.findIndex(w => w.id === x); if(i >= 0) return setShopWeapon(i); },
  next(){ return setShopWeapon(shopWeaponIndex + 1); }, prev(){ return setShopWeapon(shopWeaponIndex - 1); },
  current(){ return WEAPONS[shopWeaponIndex].id; },
  previewWeapon(){ return (shopOpen && shopTab === 'weapons') ? WEAPONS[shopWeaponIndex].id : null; },
});
// ====== Écran boutique (UI bas-centre, inspirée réf) ======
function shopStatCard(label, val){ return `<div class="shop-statcard"><span>${label}</span><b>${val}</b></div>`; }
function upgRow(type, lvl, spec, cost, attr){
  const btn = (cost == null) ? `<button class="shop-upg-btn" disabled>Max</button>`
    : `<button class="shop-upg-btn buy" ${attr}="${type}"${save.money >= cost ? '' : ' disabled'}>+ · 💰${cost}</button>`;
  return `<div class="shop-statrow"><span>${spec.name} <i>Niv ${lvl}/${spec.max}</i></span>${btn}</div>`;
}
function renderShop(){
  const info = document.getElementById('shop-info'); if(!info) return;
  const mv = document.getElementById('shop-money-val'); if(mv) mv.textContent = save.money;
  let html = '';
  if(shopTab === 'weapons'){
    const w = WEAPONS[shopWeaponIndex], owned = save.ownedWeapons.includes(w.id), equipped = save.selectedWeapon === w.id, s = weaponStats(w.id);
    const lvlTotal = Object.keys(UPGRADE_SPECS).reduce((a,t)=>a+upgradeLevel(w.id,t),0), lvlMax = Object.keys(UPGRADE_SPECS).length*5;
    html += `<div class="shop-wname">${w.name} <span class="shop-rating">★ ${lvlTotal}/${lvlMax}</span></div>`;
    html += `<div class="shop-statcards">`
      + shopStatCard('Dégâts', Math.round(60 * s.dmgMult)) + shopStatCard('Tirs/min', Math.round(60 / s.cooldown))
      + shopStatCard('Chargeur', s.mag) + shopStatCard('Recul', s.recoil.toFixed(1)) + `</div>`;
    html += `<div class="shop-btns">`;
    if(equipped) html += `<div class="shop-badge">✓ Équipée</div>`;
    else if(owned) html += `<button class="shop-cta" data-equip="${w.id}">Équiper</button>`;
    else html += `<button class="shop-cta buy" data-buy="${w.id}"${save.money >= w.price ? '' : ' disabled'}>Acheter · 💰${w.price}</button>`;
    if(owned) html += `<button id="shop-ameliorer" class="shop-cta ameliorer${shopAmeliorerOpen ? ' open' : ''}">★ Améliorer</button>`;
    html += `</div>`;
    if(owned && shopAmeliorerOpen){ html += `<div class="shop-upgrades">`;
      for(const t in UPGRADE_SPECS) html += upgRow(t, upgradeLevel(w.id, t), UPGRADE_SPECS[t], upgradeCost(w.id, t), 'data-upg');
      html += `</div>`; }
  } else if(shopTab === 'player'){
    const sel = save.selectedCharacterId || CHARACTERS[0].id;
    html += `<div class="shop-wname">Personnage</div>`;
    html += `<div class="shop-chartable"><div class="shop-chartr shop-charhead"><span>Perso</span><span>Vie</span><span>Régén</span><span>Vit.</span><span></span></div>`;
    for(const c of CHARACTERS){
      const owned = save.ownedCharacters.includes(c.id), eq = sel === c.id;
      const act = eq ? `<span class="shop-chartag">✓</span>`
        : owned ? `<button class="shop-charbtn" data-selchar="${c.id}">Équiper</button>`
        : `<button class="shop-charbtn buy" data-buychar="${c.id}"${save.money >= c.price ? '' : ' disabled'}>💰${c.price}</button>`;
      html += `<div class="shop-chartr${eq ? ' on' : ''}"><span>${c.name}</span><span>${c.base.health}</span><span>${c.base.regen}</span><span>${c.base.speed.toFixed(2)}×</span><span>${act}</span></div>`;
    }
    html += `</div><div class="shop-sub2">Améliorer (toutes vos parties)</div><div class="shop-upgrades nobox">`;
    for(const t in PLAYER_UPGRADE_SPECS) html += upgRow(t, playerUpgradeLevel(t), PLAYER_UPGRADE_SPECS[t], playerUpgradeCost(t), 'data-pupg');
    html += `</div>`;
  } else {   // onglet Skins (#16) : teintes cosmétiques du perso
    const sel = save.selectedSkin || 'default';
    html += `<div class="shop-wname">Skins</div>`;
    html += `<div class="shop-chartable"><div class="shop-chartr shop-charhead"><span>Skin</span><span></span><span></span><span></span><span></span></div>`;
    for(const s of SKINS){
      const owned = save.ownedSkins.includes(s.id), eq = sel === s.id;
      const sw = s.tint == null ? 'linear-gradient(135deg,#9aa,#e8edf6)' : '#' + s.tint.toString(16).padStart(6, '0');
      const act = eq ? `<span class="shop-chartag">✓</span>`
        : owned ? `<button class="shop-charbtn" data-selskin="${s.id}">Équiper</button>`
        : `<button class="shop-charbtn buy" data-buyskin="${s.id}"${save.money >= s.price ? '' : ' disabled'}>💰${s.price}</button>`;
      html += `<div class="shop-chartr${eq ? ' on' : ''}"><span>${s.name}</span><span><i class="shop-swatch" style="background:${sw}"></i></span><span></span><span></span><span>${act}</span></div>`;
    }
    html += `</div>`;
  }
  info.classList.toggle('left', shopTab === 'player' || shopTab === 'skins');   // bloc à gauche pour perso & skins
  info.innerHTML = html;
  info.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { if(buyWeapon(b.dataset.buy)) renderShop(); });
  info.querySelectorAll('[data-equip]').forEach(b => b.onclick = () => { if(equipWeapon(b.dataset.equip)) renderShop(); });
  info.querySelectorAll('[data-upg]').forEach(b => b.onclick = () => { if(buyUpgrade(WEAPONS[shopWeaponIndex].id, b.dataset.upg)) renderShop(); });
  info.querySelectorAll('[data-pupg]').forEach(b => b.onclick = () => { if(buyPlayerUpgrade(b.dataset.pupg)) renderShop(); });
  info.querySelectorAll('[data-buychar]').forEach(b => b.onclick = () => { if(buyCharacter(b.dataset.buychar)) renderShop(); });
  info.querySelectorAll('[data-selchar]').forEach(b => b.onclick = () => { if(selectCharacter(b.dataset.selchar)){ showSelectedCharacter(); renderShop(); } });
  info.querySelectorAll('[data-buyskin]').forEach(b => b.onclick = () => { if(buySkin(b.dataset.buyskin)) renderShop(); });
  info.querySelectorAll('[data-selskin]').forEach(b => b.onclick = () => { if(selectSkin(b.dataset.selskin)) renderShop(); });
  const am = document.getElementById('shop-ameliorer'); if(am) am.onclick = () => { shopAmeliorerOpen = !shopAmeliorerOpen; renderShop(); };
}

// ====== Combat : tir hitscan, cibles (entités), munitions, juice ======
const RESPAWN_DELAY = 2.0, SHOT_RANGE = 80;
let ammo = 12, reloading = false, reloadAt = 0, lastShot = -1, score = 0;
const targets = [];                 // entités-données : { id, mesh, alive, respawnAt }
const _ray = new THREE.Raycaster();
const nowS = () => performance.now() / 1000;

function spawnTarget(x, y, z){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, 1.4, 16),
    new THREE.MeshStandardMaterial({ color:0xff4d4d, emissive:0x551111, roughness:0.5 }));
  mesh.position.set(x, y, z); mesh.castShadow = true; scene.add(mesh);
  mesh.updateMatrixWorld();   // matrice monde prête immédiatement (raycast dès le 1er tir)
  const t = { id: targets.length, mesh, alive:true, respawnAt:0 };
  targets.push(t); return t;
}
function clearTargets(){ for(const t of targets) scene.remove(t.mesh); targets.length = 0; }
function spawnDefaultTargets(){
  clearTargets();
  spawnTarget(-6, 0.7, 8); spawnTarget(0, 0.7, 14); spawnTarget(6, 0.7, 9);
  spawnTarget(-9, 0.7, -3); spawnTarget(9, 0.7, 2);
}
function hitTarget(t){
  t.alive = false; t.mesh.visible = false; t.respawnAt = nowS() + RESPAWN_DELAY;
  score++; G.score = score; flashHitMarker();
}
function tryFire(){
  if(G.phase!=='playing' || reloading || ammo <= 0) return false;
  if(nowS() - lastShot < curCooldown) return false;
  lastShot = nowS(); ammo--; G.ammo = ammo; shake = 1; playSound('shot'); weaponRecoil = curRecoil;
  _ray.setFromCamera({ x:0, y:0 }, camera);                 // rayon = centre de l'écran (viseur)
  const shoot = [];
  for(const t of targets) if(t.alive) shoot.push(t.mesh);
  for(const e of enemies) if(e.alive) shoot.push(e.hitbox);
  const hits = _ray.intersectObjects(shoot, false);
  const end = hits.length ? hits[0].point.clone()
    : _ray.ray.origin.clone().add(_ray.ray.direction.clone().multiplyScalar(SHOT_RANGE));
  spawnTracer(_ray.ray.origin, end);
  if(hits.length){
    const obj = hits[0].object;
    const t = targets.find(t => t.mesh === obj);
    if(t) hitTarget(t);
    else { const e = enemies.find(e => e.hitbox === obj);
      if(e){ const relY = hits[0].point.y - e.root.position.y; damageEnemy(e, Math.round(hitZoneDamage(relY).damage * curDmgMult)); } }
  }
  return true;
}
function reload(){
  if(reloading || ammo === curMag || G.phase!=='playing') return;
  reloading = true; reloadAt = nowS() + curReload; playSound('reload');
}
// juice : trace de balle qui s'efface
const tracers = [];
function spawnTracer(from, to){
  const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:0xfff1a8, transparent:true, opacity:0.9 }));
  scene.add(line); tracers.push({ line, life:0.08 });
}
function updateTracers(dt){
  for(let i=tracers.length-1;i>=0;i--){
    const tr = tracers[i]; tr.life -= dt;
    tr.line.material.opacity = Math.max(0, tr.life/0.08) * 0.9;
    if(tr.life<=0){ scene.remove(tr.line); tr.line.geometry.dispose(); tr.line.material.dispose(); tracers.splice(i,1); }
  }
}
let hmT = null;
function flashHitMarker(){
  const hm = document.getElementById('hitmarker'); hm.classList.add('show');
  clearTimeout(hmT); hmT = setTimeout(() => hm.classList.remove('show'), 120);
}
function updateCombatHud(){
  document.getElementById('combat').innerHTML =
    `Score <b>${score}</b><br>${reloading ? 'Recharge…' : '🔫 ' + ammo + ' / ' + curMag}`;
}
function updateCombat(dt){
  if(G.phase!=='playing') return;
  if(reloading && nowS() >= reloadAt){ ammo = curMag; reloading = false; G.ammo = ammo; }
  if(input.fire) tryFire();
  const t = nowS();
  for(const tg of targets){ if(!tg.alive && t >= tg.respawnAt){ tg.alive = true; tg.mesh.visible = true; } }
  updateTracers(dt);
  const aiming = input.aim && G.phase==='playing';
  document.getElementById('sight').classList.toggle('show', aiming);
  document.getElementById('scope').classList.toggle('show', aiming);
  document.getElementById('crosshair').style.visibility = aiming ? 'hidden' : 'visible';
  updateCombatHud();
}
G.debug.tryFire = () => tryFire();
G.debug.reload = () => reload();
G.debug.clearTargets = () => clearTargets();
G.debug.targetsAlive = () => targets.filter(t => t.alive).length;
G.debug.spawnTargetInFront = (dist=8) => {
  _ray.setFromCamera({ x:0, y:0 }, camera);
  const p = _ray.ray.origin.clone().add(_ray.ray.direction.clone().multiplyScalar(dist));
  return spawnTarget(p.x, p.y, p.z).id;
};

// ====== Joueur : vie / dégâts / régénération ======
const BASE_MAX_HEALTH = 100, REGEN_DELAY = 6, BASE_REGEN_RATE = 10;   // régén plus lente (~10 s pour remonter à fond)
let maxHealth = BASE_MAX_HEALTH, regenRate = BASE_REGEN_RATE, speedMult = 1;   // effectifs (selon améliorations #15)
let health = maxHealth, lastDamageAt = -999;
G.health = maxHealth; G.maxHealth = maxHealth;
// ====== Améliorations du perso (#15) ======
// ====== Catalogue de personnages (achat ; stats de base par perso) ======
const CHARACTERS = [
  { id:'perso:blue-soldier', name:'Blue-Soldier', price:0,    base:{ health:100, regen:10, speed:1.00 } },
  { id:'perso:guard',        name:'Sentinel',     price:1500, base:{ health:135, regen:13, speed:1.00 } },
  { id:'perso:robot',        name:'Cyborg',       price:3000, base:{ health:175, regen:17, speed:1.15 } },
];
function characterById(id){ return CHARACTERS.find(c => c.id === id) || CHARACTERS[0]; }
const PLAYER_UPGRADE_SPECS = {
  health: { name:'Vie',     max:5, baseCost:300, perLevel:20 },
  regen:  { name:'Régén',   max:5, baseCost:250, perLevel:3 },
  speed:  { name:'Vitesse', max:5, baseCost:350, perLevel:0.06 },
};
function playerUpgradeLevel(type){ return (save.playerUpgrades && save.playerUpgrades[type]) || 0; }
function playerUpgradeCost(type){ const l = playerUpgradeLevel(type);
  return l >= PLAYER_UPGRADE_SPECS[type].max ? null : PLAYER_UPGRADE_SPECS[type].baseCost * (l + 1); }
function applyPlayerStats(){
  const b = characterById(save.selectedCharacterId).base;   // base du perso équipé + améliorations (#15)
  maxHealth = b.health + PLAYER_UPGRADE_SPECS.health.perLevel * playerUpgradeLevel('health');
  regenRate = b.regen  + PLAYER_UPGRADE_SPECS.regen.perLevel  * playerUpgradeLevel('regen');
  speedMult = b.speed * (1 + PLAYER_UPGRADE_SPECS.speed.perLevel * playerUpgradeLevel('speed'));
  G.maxHealth = maxHealth;
}
function buyPlayerUpgrade(type){
  const spec = PLAYER_UPGRADE_SPECS[type]; if(!spec) return false;
  const cost = playerUpgradeCost(type);
  if(cost == null || save.money < cost) return false;
  if(!save.playerUpgrades) save.playerUpgrades = {};
  save.money -= cost; G.money = save.money; save.playerUpgrades[type] = playerUpgradeLevel(type) + 1;
  persist(); updateMoneyHud(); updateHomeMeta(); applyPlayerStats(); return true;   // effet immédiat
}
function buyCharacter(id){
  const c = CHARACTERS.find(c => c.id === id); if(!c) return false;
  if(save.ownedCharacters.includes(id) || save.money < c.price) return false;
  save.money -= c.price; G.money = save.money; save.ownedCharacters.push(id);
  persist(); updateMoneyHud(); updateHomeMeta(); return true;
}
function selectCharacter(id){
  if(!CHARACTERS.find(c => c.id === id) || !save.ownedCharacters.includes(id)) return false;
  save.selectedCharacterId = id; persist(); applyPlayerStats(); return true;
}
applyPlayerStats();   // reflète les améliorations sauvegardées dès le chargement
G.debug.playerStats = () => ({ maxHealth, regenRate, speedMult });
G.debug.shop.charCatalog = () => CHARACTERS.map(c => ({ id:c.id, name:c.name, price:c.price, base:c.base }));
G.debug.shop.buyCharacter = (id) => buyCharacter(id);
G.debug.shop.selectCharacter = (id) => selectCharacter(id);
G.debug.shop.skinCatalog = () => SKINS.map(s => ({ id:s.id, name:s.name, price:s.price }));
G.debug.shop.buySkin = (id) => buySkin(id);
G.debug.shop.selectSkin = (id) => selectSkin(id);
function updateHealthHud(){
  const bar = document.getElementById('health-fill');
  if(bar) bar.style.width = (Math.max(0, health) / maxHealth * 100) + '%';
}
function flashDamage(){
  const v = document.getElementById('vignette'); v.classList.add('show');
  clearTimeout(v.__t); v.__t = setTimeout(() => v.classList.remove('show'), 220);
}
function damagePlayer(amount){
  if(G.phase !== 'playing') return;
  health = Math.max(0, health - amount); G.health = health; lastDamageAt = nowS();
  flashDamage(); updateHealthHud(); playSound('playerHit');
  if(health <= 0) playerDie();
}
function updateHealth(dt){
  if(G.phase !== 'playing') return;
  if(health < maxHealth && nowS() - lastDamageAt > REGEN_DELAY){
    health = Math.min(maxHealth, health + regenRate * dt); G.health = health; updateHealthHud();
  }
}
G.debug.damagePlayer = (a) => damagePlayer(a);
G.debug.playerHealth = () => health;

function playerDie(){
  G.phase = 'dead'; recordScore(); playSound('gameover');
  if(document.pointerLockElement) document.exitPointerLock?.();
  document.getElementById('go-score').innerHTML =
    `Score : ${score} · Vague atteinte : ${wave}<br>Record : vague ${save.bestWave} · 💰 ${save.money}`;
  document.getElementById('gameover').classList.remove('hidden');
}
function restartGame(){
  document.getElementById('gameover').classList.add('hidden');
  if(model){ model.position.set(0, groundY, 0); model.rotation.y = 0; velY = 0; grounded = true; }
  applyPlayerStats(); health = maxHealth; G.health = health; lastDamageAt = -999; updateHealthHud();
  score = 0; G.score = 0; applyWeaponStats(); ammo = curMag; G.ammo = ammo; reloading = false; lastShot = -1; updateCombatHud();
  spawnDefaultTargets();
  G.phase = 'playing';
  startWave(1);
}
document.getElementById('go-restart').addEventListener('click', restartGame);
G.debug.restart = () => restartGame();

// Retour à l'accueil (depuis le Game Over) : masque les HUD, vide la scène de jeu, réaffiche le menu
function backToHome(){
  document.getElementById('gameover').classList.add('hidden');
  for(const id of ['hud','combat','wave-hud','money-hud','healthbar','crosshair','radar'])
    document.getElementById(id).classList.add('hidden');
  clearEnemies(); clearTargets();
  if(document.pointerLockElement) document.exitPointerLock?.();
  G.phase = 'lobby';
  document.getElementById('lobby').classList.remove('hidden');
  updateHomeMeta(); setLobbyCamera();
  if(characters[lobbyIndex]) previewCharacter(lobbyIndex);

function segHitsAABB(ax, az, bx, bz, b){
  const dx = bx - ax, dz = bz - az; let t0 = 0, t1 = 1;
  const p = [-dx, dx, -dz, dz], q = [ax - b.minX, b.maxX - ax, az - b.minZ, b.maxZ - az];
  for(let i = 0; i < 4; i++){
    if(p[i] === 0){ if(q[i] < 0) return false; }
    else { const r = q[i] / p[i];
      if(p[i] < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
      else { if(r < t0) return false; if(r < t1) t1 = r; } }
  }
  return true;

function peekTarget(ex, ez, px, pz, obs){

  const dx=px-ex, dz=pz-ez, len=Math.hypot(dx,dz)||1, perpx=-dz/len, perpz=dx/len;

function radarBlip(ex, ez, px, pz, yaw, range, radius){

}

async function buildEnemyAssets(playerChar){

function faceDir(e, vx, vz, dt){
  const target = Math.atan2(vx, vz);
  let a = e.root.rotation.y;
  let diff = ((target - a + Math.PI) % (Math.PI*2)) - Math.PI;
  e.root.rotation.y = a + diff*Math.min(1, dt*ENEMY_TURN);
}
function moveToward(e, tx, tz, spd, dt){
  const dx = tx - e.root.position.x, dz = tz - e.root.position.z;
  const len = Math.hypot(dx, dz) || 1;
  e.root.position.x += (dx/len)*spd*dt;
  e.root.position.z += (dz/len)*spd*dt;
  faceDir(e, dx/len, dz/len, dt);
}
function pickPatrol(e){
  e.target = { x:(Math.random()*2-1)*MAP_HALF*0.9, z:(Math.random()*2-1)*MAP_HALF*0.9 };
}
function faceToward(e, tx, tz, dt){
  const dx = tx - e.root.position.x, dz = tz - e.root.position.z;

}
function clampEnemy(e){

  e.root.position.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, e.root.position.z));
  for(const b of obstacles){
    const o = pushOutCircleAABB(e.root.position.x, e.root.position.z, ENEMY_R, b);

}
function setEnemyLoco(e, state){

  const prev = e.actions[e.loco];

  e.loco = state;
}

async function loadWeaponTemplate(weaponId = save.selectedWeapon){

    const url = await findWeaponGlb();
    if(url){ try {
      const g = await loader.loadAsync(url);
      g.scene.updateMatrixWorld(true);                     // matrices à jour avant la mesure (bbox fiable)
      const box = new THREE.Box3().setFromObject(g.scene), s = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxd = Math.max(s.x, s.y, s.z) || 1, sc = WEAPON_LEN / maxd;
      g.scene.scale.setScalar(sc);
      g.scene.position.sub(center.multiplyScalar(sc));     // recentrer à l'origine
      g.scene.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
      // axe le plus long = canon ; on le ramène sur +Z (convention du primitive)
      const wrap = new THREE.Group();
      if(s.x >= s.y && s.x >= s.z) g.scene.rotation.y = -Math.PI/2;       // +X -> +Z
      else if(s.y >= s.x && s.y >= s.z) g.scene.rotation.x = Math.PI/2;   // +Y -> +Z
      wrap.add(g.scene);
      weaponSource = 'glb'; return wrap;
    } catch(e){} }

}

let actx = null, masterGain = null, muted = false; const soundLog = [];

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
}

  const d = buf.getChannelData(0); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1);

  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1800;

}

  try {
    switch(type){
      case 'shot':      noise(0.08, 0.6, 2200); tone(180, 0.07, 'square', 0.25, 60); break;
      case 'enemyShot': noise(0.07, 0.35, 1200); tone(120, 0.07, 'square', 0.18, 50); break;
      case 'hit':       tone(900, 0.06, 'triangle', 0.4, 1300); break;
      case 'enemyDie':  tone(220, 0.35, 'sawtooth', 0.45, 60); noise(0.18, 0.3, 700); break;
      case 'playerHit': tone(110, 0.18, 'sine', 0.6, 70); break;
      case 'gameover':  tone(440, 0.9, 'sine', 0.5, 90); break;
      case 'reload':    noise(0.03, 0.3, 2500); setTimeout(() => { try{ noise(0.03, 0.3, 2500); }catch(e){} }, 120); break;
    }
  } catch(e){}
}
function setMuted(b){ muted = !!b; if(masterGain) masterGain.gain.value = muted ? 0 : save.settings.volume; }
G.debug.audio = {
  init(){ initAudio(); }, play(type){ playSound(type); }, muted(){ return muted; }, setMuted(b){ setMuted(b); },
  count(){ return soundLog.length; }, last(){ return soundLog[soundLog.length-1] || null; },
  state(){ return actx ? actx.state : 'none'; }
};

// ====== Assistance de visée (douce, horizontale uniquement) ======
const AIM_ASSIST_ANGLE = 0.18, AIM_ASSIST_RANGE = 30, AIM_ASSIST_GAIN = 6;
function updateAimAssist(dt){
  if(!input.aim || !model || G.phase !== 'playing') return;
  let bestDiff = null, bestAng = AIM_ASSIST_ANGLE;
  for(const e of enemies){
    if(!e.alive) continue;
    const dx = e.root.position.x - model.position.x, dz = e.root.position.z - model.position.z;
    if(Math.hypot(dx, dz) > AIM_ASSIST_RANGE) continue;
    const yawTo = Math.atan2(dx, dz);
    const diff = ((yawTo - camYaw + Math.PI) % (Math.PI*2)) - Math.PI;
    if(Math.abs(diff) < bestAng){ bestAng = Math.abs(diff); bestDiff = diff; }
  }
  if(bestDiff !== null) camYaw += bestDiff * Math.min(1, dt * AIM_ASSIST_GAIN * (1 - bestAng/AIM_ASSIST_ANGLE));
}

// ====== Boucle ======
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(G.phase==='playing'){ updateController(dt); updateCombat(dt); updateEnemies(dt); updateWaves(dt); updateHealth(dt); updateAimAssist(dt); updateCamera(dt); updateWeapon(dt); updateRadar(); }
  else if(G.phase==='lobby'){                                    // turntable : arme en vitrine, sinon perso
    if(shopOpen && shopTab==='weapons'){ if(shopWeaponObj) shopWeaponObj.rotation.y += dt*0.8; }
    else if(model){ model.rotation.y += dt*0.6; }
  }
  if (mixer) mixer.update(dt);
  renderer.render(scene, camera);
}
animate();
G.booted = true;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
