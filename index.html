<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commando 3D — Guns of Boom style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #1b1f24;
      font-family: system-ui, sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #cfd6dd;
      background: rgba(0, 0, 0, .35);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      user-select: none;
    }

    #hud b {
      color: #ff7a45;
    }

    #controls {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #controls button {
      background: rgba(255, 255, 255, .06);
      color: #e6ebf0;
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 13px;
      cursor: pointer;
      transition: .15s;
    }

    #controls button:hover {
      background: #ff7a45;
      color: #111;
      border-color: #ff7a45;
    }

    #controls button.active {
      background: #ff7a45;
      color: #111;
      border-color: #ff7a45;
    }
  </style>
</head>

<body>
  <canvas id="app"></canvas>
  <div id="hud">
    <b>COMMANDO</b> — membres contrôlables<br />
    <b>→</b> bras droit • <b>←</b> bras gauche • <b>↑</b> les deux bras<br />
    <b>A</b> jambe gauche • <b>E</b> jambe droite • <b>↓</b> baisser la tête<br />
    (maintenir la touche) • Souris : tourner • Molette : zoom
  </div>
  <div id="controls">
    <button id="btn-reset" class="active">Reset pose</button>
    <button id="btn-rotate">Rotation auto</button>
    <button id="btn-wire">Filaire</button>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------- Scene ----------
    const canvas = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9aa3ab);
    scene.fog = new THREE.Fog(0x9aa3ab, 18, 40);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(3.2, 3.0, 6.2);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 2.0, 0);
    controls.minDistance = 3;
    controls.maxDistance = 16;

    // ---------- Lights ----------
    const hemi = new THREE.HemisphereLight(0xffffff, 0x4a5560, 0.85);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 1.7);
    key.position.set(5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1; key.shadow.camera.far = 30;
    key.shadow.camera.left = -8; key.shadow.camera.right = 8;
    key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xff8a5c, 0.6);
    rim.position.set(-6, 4, -5);
    scene.add(rim);

    // ---------- Ground ----------
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(14, 48),
      new THREE.MeshStandardMaterial({ color: 0x7f8890, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- Personnage : commando_1.glb découpé en membres ----------
    const root = new THREE.Group();
    scene.add(root);

    const character = new THREE.Group();   // contient tête, torse, bras, jambes
    root.add(character);

    const meshMaterials = [];              // pour le mode filaire
    const limbs = {};                      // pivots animables : armR, armL, legR, legL, head

    // Construit une sous-géométrie à partir des triangles dont le centroïde passe `keep(centroid)`
    function buildRegion(geo, material, keep) {
      const pos = geo.attributes.position;
      const nor = geo.attributes.normal;
      const uv = geo.attributes.uv;
      const index = geo.index;
      const triCount = index ? index.count / 3 : pos.count / 3;
      const P = [], N = [], U = [];
      const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), cen = new THREE.Vector3();

      for (let t = 0; t < triCount; t++) {
        const i0 = index ? index.getX(t * 3) : t * 3;
        const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
        const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;
        a.fromBufferAttribute(pos, i0);
        b.fromBufferAttribute(pos, i1);
        c.fromBufferAttribute(pos, i2);
        cen.copy(a).add(b).add(c).multiplyScalar(1 / 3);
        if (!keep(cen)) continue;
        for (const ii of [i0, i1, i2]) {
          P.push(pos.getX(ii), pos.getY(ii), pos.getZ(ii));
          if (nor) N.push(nor.getX(ii), nor.getY(ii), nor.getZ(ii));
          if (uv) U.push(uv.getX(ii), uv.getY(ii));
        }
      }
      if (!P.length) return null;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      if (N.length) g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
      if (U.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
      if (!N.length) g.computeVertexNormals();
      const mesh = new THREE.Mesh(g, material);
      mesh.castShadow = true; mesh.receiveShadow = true;
      return mesh;
    }

    // Place un mesh dans un pivot situé à `joint` (coords locales) → il tourne autour de l'articulation
    function pivotize(mesh, joint) {
      const piv = new THREE.Group();
      piv.position.copy(joint);
      mesh.position.copy(joint).multiplyScalar(-1);
      piv.add(mesh);
      return piv;
    }

    new GLTFLoader().load('commando_1.glb', (gltf) => {
      // récupère le maillage unique + son matériau (avec texture)
      let src = null;
      gltf.scene.traverse(o => { if (o.isMesh && !src) src = o; });
      const geo = src.geometry;
      const material = src.material;
      material.side = THREE.DoubleSide;
      meshMaterials.push(material);

      geo.computeBoundingBox();
      const bb = geo.boundingBox;
      const minY = bb.min.y, maxY = bb.max.y, h = maxY - minY;
      const ny = p => (p.y - minY) / h;          // 0 = pieds, 1 = sommet de la tête

      // Seuils issus de l'analyse du profil du modèle
      const HEAD = 0.84;      // au-dessus = tête
      const BAND = 0.45;      // [BAND, HEAD] = zone torse/bras
      const ARMX = 0.27;      // |x| au-delà (dans la bande) = bras
      const LEGX = 0.04;      // |x| au-delà (en bas) = jambe

      // Découpe en régions selon le centroïde de chaque triangle
      const headMesh = buildRegion(geo, material, p => ny(p) > HEAD);
      const torsoMesh = buildRegion(geo, material, p => {
        const y = ny(p);
        if (y > HEAD) return false;
        if (y >= BAND) return Math.abs(p.x) <= ARMX;       // centre de la bande = torse
        return Math.abs(p.x) <= LEGX;                       // bas central = bassin
      });
      const armRMesh = buildRegion(geo, material, p => ny(p) >= BAND && ny(p) <= HEAD && p.x > ARMX);
      const armLMesh = buildRegion(geo, material, p => ny(p) >= BAND && ny(p) <= HEAD && p.x < -ARMX);
      const legRMesh = buildRegion(geo, material, p => ny(p) < BAND && p.x > LEGX);
      const legLMesh = buildRegion(geo, material, p => ny(p) < BAND && p.x < -LEGX);

      // Articulations (coords locales)
      const shoulderY = minY + 0.80 * h;
      const hipY = minY + 0.46 * h;
      const headY = minY + 0.84 * h;
      const jShoulderR = new THREE.Vector3(0.25, shoulderY, 0);
      const jShoulderL = new THREE.Vector3(-0.25, shoulderY, 0);
      const jHipR = new THREE.Vector3(0.10, hipY, 0);
      const jHipL = new THREE.Vector3(-0.10, hipY, 0);
      const jHead = new THREE.Vector3(0.00, headY, 0);

      if (torsoMesh) character.add(torsoMesh);
      if (headMesh) { limbs.head = pivotize(headMesh, jHead); character.add(limbs.head); }
      if (armRMesh) { limbs.armR = pivotize(armRMesh, jShoulderR); character.add(limbs.armR); }
      if (armLMesh) { limbs.armL = pivotize(armLMesh, jShoulderL); character.add(limbs.armL); }
      if (legRMesh) { limbs.legR = pivotize(legRMesh, jHipR); character.add(limbs.legR); }
      if (legLMesh) { limbs.legL = pivotize(legLMesh, jHipL); character.add(limbs.legL); }

      // Échelle + position : ~3.6 u de haut, pieds au sol, centré
      const box = new THREE.Box3().setFromObject(character);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 3.6 / Math.max(size.x, size.y, size.z);
      character.scale.setScalar(scale);
      character.position.sub(center.multiplyScalar(scale));
      character.position.y += (size.y * scale) / 2;

      const fitH = size.y * scale;
      controls.target.set(0, fitH * 0.5, 0);
      camera.position.set(2.6, fitH * 0.55, 5.2);
    }, undefined, (err) => {
      console.error('Erreur de chargement du .glb :', err);
    });

    // ---------- Contrôle des membres ----------
    // angle.cur suit angle.tgt en douceur ; chaque membre tourne autour d'un axe donné
    const pose = {
      armR: { cur: 0, tgt: 0, axis: 'z', up: 1.6 },   // bras droit (+x) : +Z lève vers l'extérieur
      armL: { cur: 0, tgt: 0, axis: 'z', up: -1.6 },   // bras gauche (-x) : -Z lève vers l'extérieur
      legR: { cur: 0, tgt: 0, axis: 'x', up: 1.0 },   // jambe droite : avance
      legL: { cur: 0, tgt: 0, axis: 'x', up: 1.0 },   // jambe gauche : avance
      head: { cur: 0, tgt: 0, axis: 'x', up: 0.5 },   // tête : baisse
    };
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    });
    addEventListener('keyup', e => { keys[e.key] = false; });

    function updatePoseTargets() {
      // par défaut tout revient à 0 ; une touche maintenue lève le membre
      pose.armR.tgt = keys['ArrowRight'] || keys['ArrowUp'] ? pose.armR.up : 0;
      pose.armL.tgt = keys['ArrowLeft'] || keys['ArrowUp'] ? pose.armL.up : 0;
      pose.legL.tgt = (keys['a'] || keys['A']) ? pose.legL.up : 0;
      pose.legR.tgt = (keys['e'] || keys['E']) ? pose.legR.up : 0;
      pose.head.tgt = keys['ArrowDown'] ? pose.head.up : 0;
    }

    // ---------- UI ----------
    let autoRotate = false;
    let wire = false;
    const btnReset = document.getElementById('btn-reset');
    const btnRotate = document.getElementById('btn-rotate');
    const btnWire = document.getElementById('btn-wire');

    btnReset.onclick = () => { for (const k in keys) keys[k] = false; };
    btnRotate.onclick = () => { autoRotate = !autoRotate; btnRotate.classList.toggle('active', autoRotate); };
    btnWire.onclick = () => {
      wire = !wire;
      meshMaterials.forEach(m => m.wireframe = wire);
      btnWire.classList.toggle('active', wire);
    };

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePoseTargets();
      for (const name in pose) {
        const p = pose[name];
        p.cur += (p.tgt - p.cur) * Math.min(1, dt * 10); // lissage
        const piv = limbs[name];
        if (piv) piv.rotation[p.axis] = p.cur;
      }

      if (autoRotate) character.rotation.y += 0.01;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>

</html>
